games:
    heading: Игры
    starWars:
        title: Star Wars WoD 2e
        summary: Галактика Star Wars на движке пулов d10 второй редакции Мира Тьмы. Листы персонажей, дроидов, существ, транспорта и групп статистов; правила, каталоги с поиском и разобранный пример игры.
        quickStart: Быстрый старт
        rules: Правила
    v5:
        title: Мир Тьмы V5
        summary: '«Охотник: Воздаяние» и «Вампир: Маскарад» на одном движке, а для людей, которых встречают игроки, — персонажи рассказчика и группы. Броски сами учитывают Безысходность, Голод и критические успехи.'
        hunterQuickStart: 'Охотник: быстрый старт'
        vampireQuickStart: 'Вампир: быстрый старт'
        rules: Правила
features:
    heading: Что умеет сайт
    documents:
        title: Документы, а не только персонажи
        summary: Персонажи, существа, транспорт и группы в папках, с поиском, фильтрами и отменой действий. У каждого встроенного типа есть полный и краткий лист, который помещается на экран телефона.
    layout:
        title: Несколько документов сразу
        summary: Располагайте документы и инструменты как вкладки в редакторе кода — делите экран в любую сторону, перетаскивайте вкладки между группами, выносите библиотеку или кубики в плавающие окна.
    templates:
        title: Страницы можно менять
        summary: Каждый лист — это шаблон. Правьте страницу на месте или создавайте в библиотеке свои сеттинги, типы документов и каталоги и делитесь ими в файлах.
    dice:
        title: Броски кубиков
        summary: Нотация со взрывами, перебросами, подсчётом успехов и особыми кубиками; 3D-кубики с физикой и звуком или простые 2D-результаты. Характеристика на листе бросает свой пул.
    rollSharing:
        title: Броски в вашем чате
        summary: Отправляйте броски в канал Discord или комнату Matrix с именем персонажа, который бросал.
    storage:
        title: Данные остаются у вас
        summary: Без регистрации. Документы сохраняются в браузере по мере ввода; экспортируйте документ или шаблон в файл и импортируйте его на другом устройстве.
