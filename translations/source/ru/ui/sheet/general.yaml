system: Общее
library:
    intro: Документы для любой игры — заметки и другие виды, которым не нужны правила. Поставляются с приложением.
    ownTypes: Любая игра
    ownTypesNote: Виды для любой игры, вне всех сеттингов. Их страницы служат запасными для ваших сеттингов здесь.
    coreTypes: 'Виды для любой игры: {names}. Они есть в каждом вашем сеттинге здесь.'
    coreTypeNote: Вид для любой игры внутри вашего сеттинга. Дайте ему здесь свои страницы; его нельзя переместить или удалить.
note:
    type: Заметка
    view: Заметка
    name: Название
    body: Текст
    mentions: Упоминается в
    example:
        label: Как устроены заметки
        name: Как устроены заметки
        text: |
            # Как устроены заметки
            Каждая строка — отдельный абзац, так что пишите, как думаете.
            Нажмите **Править** (или Ctrl+E), чтобы изменить заметку, и **Готово** (или Esc), чтобы читать.
            ## Оформление
            **Жирный**, *курсив*, ~~зачёркнутый~~, ==выделенный==, `код` и [ссылки](https://example.org).
            ## Списки и чек-листы
            - [x] Отмечайте пункты прямо при чтении
            - [ ] Подготовить сцену в доках
              - Инес ждёт у ящиков
            1. Нумерованные списки тоже работают
            ## Таблицы
            | Персонаж | Чего хочет |
            |:---|:---|
            | Инес Руис | денег |
            | Бруно Кессель | чтобы его оставили в покое |
            ## Выноски
            > [!tip] Открытая выноска
            > Для всего, что должно бросаться в глаза.

            > [!spoiler]- Свёрнутая выноска
            > Начинается свёрнутой: откройте, когда игроки доберутся до этого места.
            ## Броски
            Засада: `dice: 6d10>=6`
            ## Картинки
            Вставьте снимок экрана во время правки или нажмите кнопку картинки на панели инструментов: картинка сохранится на этом устройстве, а на месте курсора появится `![[её имя]]`.
            Картинка из интернета работает по адресу HTTPS: `![Карта](https://…)`.
