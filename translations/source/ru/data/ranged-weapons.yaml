hold-out-blaster:
    name: Скрытый бластер
    notes: Легко спрятать. Самая слабая останавливающая сила среди бластеров.
light-blaster-pistol:
    name: Лёгкий бластерный пистолет
    notes: Стандартное личное оружие. Самый распространённый бластер в галактике.
heavy-blaster-pistol:
    name: Тяжёлый бластерный пистолет
    notes: Мощное личное оружие. Наибольший урон среди одноручных бластеров.
sporting-blaster-rifle:
    name: Спортивная бластерная винтовка
    notes: Гражданская охотничья винтовка. Менее надёжна, чем армейская.
blaster-carbine:
    name: Бластерный карабин
    notes: Укороченная винтовка. Ствол короче, но стрельба по-прежнему с упором в плечо.
blaster-rifle:
    name: Бластерная винтовка
    notes: Стандартное армейское длинноствольное оружие. Силового блока хватает на долгий бой.
heavy-blaster-rifle:
    name: Тяжёлая бластерная винтовка
    notes: Мощная армейская винтовка. Сильная отдача, но разрушительный урон.
blaster-sniper-rifle:
    name: Снайперская бластерная винтовка
    notes: Точное оружие для дальнего боя. Разбирается для переноски.
light-repeating-blaster:
    name: Лёгкий скорострельный бластер
    notes: Может вести полностью автоматический огонь. Ленточное питание от силового блока.
slugthrower-pistol:
    name: Кинетический пистолет
    notes: Примитивное оружие, стреляющее пулями. Урон на 1D ниже, чем у аналогичного бластера.
slugthrower-rifle:
    name: Кинетическая винтовка
    notes: Кинетическое длинноствольное оружие. Урон на 1D ниже, чем у аналогичной бластерной винтовки.
bowcaster:
    name: Боукастер
    notes: Взрывные болты. Взвод требует проверки силы (запас 4).
