linguistics:
    name: 'Лингвистика'
    summary: 'Ещё один свободный язык за каждую точку сверх родного и местного.'
illiterate:
    name: 'Неграмотность'
    summary: 'Не умеет читать и писать; Гуманитарные науки и Наука не выше 1.'
beautiful:
    name: 'Красота'
    summary: 'Один дополнительный кубик в Социальных пулах, где важна внешность.'
stunning:
    name: 'Ослепительность'
    summary: 'Два дополнительных кубика в Социальных пулах, где важна внешность.'
ugly:
    name: 'Непривлекательность'
    summary: 'На один кубик меньше в Социальных пулах, где важна внешность.'
repulsive:
    name: 'Отталкивающая внешность'
    summary: 'На два кубика меньше в Социальных пулах, где важна внешность.'
solo-cooking:
    name: 'Готовка для себя'
    summary: 'Нормальная еда перед сессией лечит ещё одну клетку поверхностного урона Здоровья.'
cell-chef:
    name: 'Повар ячейки'
    summary: 'Если накормить ячейку, каждый присутствующий лечит ещё одну клетку поверхностного урона.'
living-on-the-edge:
    name: 'Жизнь на грани'
    summary: 'Новое рискованное искушение рядом даёт штраф, пока вы не поддадитесь или сцена не закончится.'
weak-willed:
    name: 'Слабовольность'
    summary: 'Вы не можете активно сопротивляться силам, влияющим на разум или чувства.'
addiction:
    name: 'Зависимость'
    summary: 'На один кубик меньше в большинстве пулов после сцены без вашего вещества.'
severe-addiction:
    name: 'Тяжёлая зависимость'
    summary: 'На два кубика меньше в большинстве пулов после сцены без вашего вещества.'
unseemly-aura:
    name: 'Странная аура'
    summary: 'Чудовища порой принимают вас за своего или за кого-то совсем другого.'
stigmata:
    name: 'Стигматы'
    summary: 'Когда вам больно, кровоточат руки, ноги и лоб — заметно и трудно скрыть.'
crones-curse:
    name: 'Проклятие старухи'
    summary: 'Вы выглядите намного старше своих лет, и у вас на одну клетку Здоровья меньше.'
allies:
    name: 'Союзники'
    summary: 'Люди вне ячейки, которые вам помогают; точки определяют, насколько они способны и надёжны.'
enemy:
    name: 'Враг'
    summary: 'Кто-то вне ячейки, кто действует против вас и появляется в самый неудобный момент.'
contacts:
    name: 'Связи'
    summary: 'Люди, которые достанут сведения или вещи — от дешёвых до труднодоступных.'
fame:
    name: 'Слава'
    summary: 'Ваше имя знают — от одной субкультуры до всего мира; оставаться незаметным трудно.'
infamy:
    name: 'Дурная слава'
    summary: 'Известны чем-то ужасным; к вам плохо относятся, а кто-то хочет вас схватить.'
dark-secret:
    name: 'Тёмная тайна'
    summary: 'Страшная тайна, о которой знают немногие, но она может всплыть.'
infamous-partner:
    name: 'Скандальный партнёр'
    summary: 'Близкий вам человек печально известен, и это бросает тень на вас.'
influence:
    name: 'Влияние'
    summary: 'Вес в одной группе или районе города, слабее в остальных; пользоваться им — привлекать внимание.'
despised:
    name: 'Ненавистный'
    summary: 'Одна группа или район города действует против вас и вашей ячейки.'
disliked:
    name: 'Нелюбимый'
    summary: 'На один кубик меньше в Социальных проверках с группами города, которые не на вашей стороне.'
mask:
    name: 'Маска'
    summary: 'Фальшивая личность, которая выдерживает проверку — местную или общенациональную.'
zeroed:
    name: 'Обнулённый'
    summary: 'Ваши настоящие записи стёрты; официально вас не существует. Нужна Маска ••.'
cobbler:
    name: 'Сапожник'
    summary: 'Вы умеете делать или доставать фальшивые личности для других. Нужна Маска ••.'
person-of-interest:
    name: 'Под наблюдением'
    summary: 'Базы спецслужб отмечают вас как угрозу; аналитики могут сложить картину.'
serial-error:
    name: 'Ошибка в записях'
    summary: 'Ошибка в записях делает любую проверку вашей личности тревожной.'
mentor:
    name: 'Наставник'
    summary: 'Опытный охотник или группа, которые время от времени советуют и прикрывают.'
adversary:
    name: 'Соперник'
    summary: 'Охотник-соперник или группа, желающие провала вам, ячейке или наставнику.'
resources:
    name: 'Ресурсы'
    summary: 'Деньги и имущество — от жизни от зарплаты до зарплаты до «всего, что можно купить».'
destitute:
    name: 'Нищета'
    summary: 'Ни денег, ни дома.'
retainers:
    name: 'Помощники'
    summary: 'Верные помощники — от увязавшегося энтузиаста до того, кто сам решает проблемы.'
stalkers:
    name: 'Преследователи'
    summary: 'Вокруг вас появляются люди, которые слишком к вам привязываются.'
safe-house:
    name: 'Убежище'
    summary: 'Жильё надёжнее и укромнее простой комнаты; помогает замечать и сдерживать чужаков.'
hidden-armory:
    name: 'Тайный арсенал'
    summary: 'Спрятанный в убежище запас обычного оружия и патронов.'
panic-room:
    name: 'Комната-убежище'
    summary: 'Запертая комната, чтобы спрятать людей или держать пленника. Не в маленьком убежище.'
watchmen:
    name: 'Охрана'
    summary: 'Охранники убежища; о сверхъестественном они ничего не знают.'
laboratory:
    name: 'Лаборатория'
    summary: 'Дополнительные кубики для научной или технической работы дома. Не в маленьком убежище.'
luxury:
    name: 'Роскошь'
    summary: 'Впечатляющая обстановка помогает в Социальных проверках с гостями.'
postern:
    name: 'Чёрный ход'
    summary: 'Потайной выход; дополнительные кубики, чтобы уйти от наблюдения поблизости.'
security-system:
    name: 'Охранная система'
    summary: 'Дополнительные кубики, чтобы не пустить чужаков или узнать о них.'
surgery:
    name: 'Операционная'
    summary: 'Полевая операционная; дополнительные кубики к Медицине дома. Не в маленьком убежище.'
compromised:
    name: 'Раскрытое убежище'
    summary: 'Здесь уже был налёт, место под наблюдением; чужаки получают дополнительные кубики.'
creepy:
    name: 'Жуткое убежище'
    summary: 'Выглядит как логово чудовища; гостям не по себе, соседи судачат.'
haunted:
    name: 'Нечистое место'
    summary: 'Здесь обитает что-то сверхъестественное, что вы не можете ни контролировать, ни изгнать.'
no-safe-house:
    name: 'Без убежища'
    summary: 'Негде чувствовать себя в безопасности: людный сквот, плохая квартира, сломанный трейлер.'
status:
    name: 'Статус'
    summary: 'Положение среди местных охотников одной фракции — от известного имени до лидера.'
shunned:
    name: 'Изгой'
    summary: 'Одна фракция охотников вас ненавидит и действует против вас.'
suspect:
    name: 'Под подозрением'
    summary: 'Вы подвели фракцию; Социальные проверки с ней даются намного труднее.'
