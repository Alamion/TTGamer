blood-sorcery-blood-walk:
    name: 'Прогулка по крови'
    summary: 'Попробовав кровь вампира, колдун узнаёт его поколение, имя и сира; критический успех раскрывает и его Узы крови.'
blood-sorcery-clinging-of-the-insect:
    name: 'Паучье лазанье'
    summary: 'Выпив кровь с раздавленным пауком, колдун на сцену может ползать по стенам и потолку.'
blood-sorcery-craft-bloodstone:
    name: 'Кровавый камень'
    summary: 'За три ночи железный камешек впитывает кровь, и колдун всегда чувствует, где он и как далеко.'
blood-sorcery-wake-with-evenings-freshness:
    name: 'Дневная бодрость'
    summary: 'Круг из пепла вокруг места сна будит колдуна в полной готовности, если днём приходит опасность.'
blood-sorcery-ward-against-ghouls:
    name: 'Оберег от гулей'
    summary: 'Кровавый знак на предмете обжигает и пугает гуля, который к нему прикоснётся.'
blood-sorcery-douse-the-fear:
    name: 'Угасание страха'
    summary: 'Поднеся святыню к огню, колдун на ночь получает дополнительные кубики против страха перед огнём.'
blood-sorcery-seal-the-brand:
    name: 'Печать клейма'
    summary: 'Расплавленное серебро на татуировке, шраме или клейме делает метку постоянной частью тела вампира.'
blood-sorcery-coax-the-garden:
    name: 'Пробуждение сада'
    summary: 'Кровь и маковые семена пробуждают растения, которые цепляют, сковывают и опутывают всех, кроме колдуна.'
blood-sorcery-communicate-with-kindred-sire:
    name: 'Воззвание к сиру'
    summary: 'С вещью сира и чашей воды птенец открывает короткую безмолвную мысленную связь со своим сиром.'
blood-sorcery-eyes-of-babel:
    name: 'Глаза Вавилона'
    summary: 'Съев глаз и язык жертвы, колдун на неделю (при критическом успехе на месяц) владеет её языками.'
blood-sorcery-illuminate-the-trail-of-prey:
    name: 'Следы жертвы'
    summary: 'Горящая пропитанная кровью лента показывает путь знакомого человека за последние сутки светящимся следом.'
blood-sorcery-truth-of-blood:
    name: 'Истина в крови'
    summary: 'Палец, погружённый в смесь с кровью собеседника, подсказывает, правдиво ли каждое его утверждение.'
blood-sorcery-ward-against-spirits:
    name: 'Оберег от духов'
    summary: 'Знак из крови и соли ранит призраков и духов, пытающихся тронуть предмет или пройти сквозь него.'
blood-sorcery-warding-circle-against-ghouls:
    name: 'Колдовской круг от гулей'
    summary: 'Оберег в виде круга на земле, через который не могут пройти гули.'
blood-sorcery-as-fog-on-water:
    name: 'Как туман над водой'
    summary: 'До конца ночи колдун может бесшумно ходить по поверхности воды.'
blood-sorcery-calix-secretus:
    name: 'Тайная чаша'
    summary: 'Запасает кровь колдуна в небольшом предмете, откуда её можно извлечь по командному слову.'
blood-sorcery-soporific-touch:
    name: 'Усыпляющее касание'
    summary: 'Витэ с примесью наркотика ослабляет сопротивление коснувшегося убеждению и подчинению разума.'
blood-sorcery-dagons-call:
    name: 'Драконье возмездие'
    summary: 'Если жертва соприкоснулась с кровью колдуна, ритуал издалека разрывает её сосуды.'
blood-sorcery-deflection-of-wooden-doom:
    name: 'Извлечение кола'
    summary: 'До конца ночи первый кол, направленный в сердце колдуна, разлетается о его кожу.'
blood-sorcery-essence-of-air:
    name: 'Лёгкость ветра'
    summary: 'Создаёт зелье, позволяющее колдуну на сцену летать или парить со скоростью бега.'
blood-sorcery-firewalker:
    name: 'Огненный путь'
    summary: 'Ценой кончика пальца урон от огня по цели до конца ночи уменьшается вдвое.'
blood-sorcery-ward-against-lupines:
    name: 'Оберег от Люпинов'
    summary: 'Кровавый знак, который обжигает и пугает оборотней, коснувшихся предмета.'
blood-sorcery-warding-circle-against-spirits:
    name: 'Колдовской круг от духов'
    summary: 'Оберег в виде круга на земле, через который не могут пройти призраки и духи.'
blood-sorcery-fire-in-the-blood:
    name: 'Огонь в крови'
    summary: 'Сжигая образец крови цели, колдун на расстоянии раскаляет её кровь, нанося урон и мучительные штрафы.'
blood-sorcery-one-with-the-blade:
    name: 'Единство с клинком'
    summary: 'Посвящает колдуну одно оружие ближнего боя: оно не тупится и после помазания даёт бонус в бою.'
blood-sorcery-defense-of-the-sacred-haven:
    name: 'Защита святилища'
    summary: 'Окутывает область до шести метров тенью, не пропускающей солнце, пока колдун остаётся внутри.'
blood-sorcery-eyes-of-the-nighthawk:
    name: 'Ястребиный взор'
    summary: 'Колдун управляет птицей, видит её глазами и может применять через неё некоторые Дисциплины.'
blood-sorcery-incorporeal-passage:
    name: 'Астральное путешествие'
    summary: 'Пока колдун держит осколок разбитого зеркала, он бесплотен и уязвим лишь для огня, солнца и магии.'
blood-sorcery-ward-against-cainites:
    name: 'Оберег от вампиров'
    summary: 'Кровавый знак, который обжигает и пугает вампиров (кроме колдуна), коснувшихся предмета.'
blood-sorcery-warding-circle-against-lupines:
    name: 'Колдовской круг от Люпинов'
    summary: 'Оберег в виде круга на земле, через который не могут пройти оборотни.'
blood-sorcery-feast-of-ashes:
    name: 'Пир пепла'
    summary: 'На одну ночь цель извергает любую выпитую кровь и может утолить Голод только пеплом.'
blood-sorcery-guided-memory:
    name: 'Ведомое воспоминание'
    summary: 'Выпив кровь донора, колдун переживает его воспоминания и на время перенимает силу или Достоинство.'
blood-sorcery-invisible-chains-of-binding:
    name: 'Незримые оковы'
    summary: 'Брошенное к ногам цели звено цепи на часы приковывает её к месту и мешает защищаться.'
blood-sorcery-escape-to-true-sanctuary:
    name: 'Отступление в истинное святилище'
    summary: 'Связывает два начерченных круга: шагнув в один, колдун мгновенно появляется в другом.'
blood-sorcery-heart-of-stone:
    name: 'Каменное сердце'
    summary: 'Сердце колдуна становится камнем: кол его не пробивает, но чувства и общительность угасают.'
blood-sorcery-shaft-of-belated-dissolution:
    name: 'Посох медленного увядания'
    summary: 'Создаёт рябиновый кол: сильный удар им уничтожает вампира, а слабый оставляет обломок, ползущий к сердцу.'
blood-sorcery-warding-circle-against-cainites:
    name: 'Колдовской круг от вампиров'
    summary: 'Оберег в виде круга на земле, через который не могут пройти вампиры.'
blood-sorcery-antebrachia-ignium:
    name: 'Пылающие руки'
    summary: 'Витэ на руках колдуна горит вместо него самого, позволяя поджигать врагов прикосновением.'
blood-sorcery-dominion:
    name: 'Владычество'
    summary: 'Железные печати над дверями не дают никому, кроме колдуна, применять в здании Анимализм, Ясновидение, Доминирование и Внушительность.'
blood-sorcery-edens-bounty:
    name: 'Щедрость Эдема'
    summary: 'Труп у подножия дерева вытягивает понемногу крови из всех смертных вокруг, утоляя Голод колдуна.'
oblivion-summon-spirit:
    name: 'Призыв духа'
    summary: 'Призывает конкретного призрака из Подземного мира через его оковы; слушаться он не обязан.'
oblivion-the-gift-of-false-life:
    name: 'Дар ложной жизни'
    summary: 'Оживляет трупы, которые выполняют одну простую повторяющуюся команду.'
oblivion-travelers-call:
    name: 'Зов Странника'
    summary: 'Жрец Шалима повторяющимся видением сообщает другому члену культа, где находится.'
oblivion-awaken-the-homuncular-servant:
    name: 'Пробуждение гомункула'
    summary: 'Превращает отрубленную часть тела или мёртвого зверька в преданного слугу-шпиона.'
oblivion-compel-spirit:
    name: 'Принуждение духа'
    summary: 'Угрожая оковам призрака, некромант заставляет его выполнять поручения.'
oblivion-host-spirit:
    name: 'Сосуд для духа'
    summary: 'Впускает призрака в тело некроманта, давая бонус к физическим проверкам, Здоровье, его советы и навыки.'
oblivion-shambling-hordes:
    name: 'Бредущие орды'
    summary: 'Жертвоприношение смертного поднимает агрессивных мертвецов, способных выполнять сложные приказы.'
oblivion-name-of-the-father:
    name: 'Имя Отца'
    summary: 'Воззвание к Шалиму на древнегреческом позволяет затем парализовать жертву отчаянием и лишить чувств.'
oblivion-bind-the-spirit:
    name: 'Сковывание духа'
    summary: 'Привязывает подчинённого призрака к месту или человеку, и его чувства передаются окружающим.'
oblivion-split-the-veil:
    name: 'Разрыв Покрова'
    summary: 'Жертвоприношение разрывает границу между мирами, позволяя призракам проникать в мир живых.'
oblivion-lazarene-blessing:
    name: 'Благословение Лазаря'
    summary: 'Вселяет призрака в только что убитое тело, позволяя ему снова жить в этой плоти.'
oblivion-ex-nihilo:
    name: 'Ex Nihilo'
    summary: 'После разрыва Покрова некромант и спутники могут во плоти перейти в Царство Теней.'
oblivion-pit-of-contemplation:
    name: 'Бездна созерцания'
    summary: 'Дверь, нарисованная кровью жертвы, открывается в Бездну и затягивает людей в бесконечную тьму.'
thin-blood-alchemy-far-reach:
    name: 'Далёкое касание'
    summary: 'Телекинез: можно двигать, толкать или тянуть предмет или человека до 100 кг, не касаясь их.'
thin-blood-alchemy-haze:
    name: 'Силуэт'
    summary: 'Облако дымки сопровождает алхимика, скрывая его облик и мешая стрелять в него.'
thin-blood-alchemy-profane-hieros-gamos:
    name: 'Нечестивый хиерос гамос'
    summary: 'Жуткая процедура и дневной сон перестраивают тело алхимика под выбранный им пол.'
thin-blood-alchemy-mercurian-tongue:
    name: 'Язык Меркурия'
    summary: 'Алхимик говорит на родном языке смертного, чья кровь вошла в формулу.'
thin-blood-alchemy-plug-in:
    name: 'Подзарядка'
    summary: 'Тело алхимика проводит слабый ток, питающий лампы и небольшие устройства через касание.'
thin-blood-alchemy-envelop:
    name: 'Пелена'
    summary: 'Туман окутывает одну цель, ослепляя её, а смертного может довести до удушья.'
thin-blood-alchemy-friends-list:
    name: 'Список друзей'
    summary: 'Показывает серебряные нити, связывающие смертных с вампирами, с которыми они знакомы.'
thin-blood-alchemy-defractionate:
    name: 'Дефракцинация'
    summary: 'Эликсир восстанавливает фракционированную донорскую кровь, чтобы ею мог питаться любой вампир.'
thin-blood-alchemy-mandagloire:
    name: 'Мандаглуар'
    summary: 'Зловонный газ из крови алхимика парализует смертных и сковывает судорогами сверхъестественных существ.'
thin-blood-alchemy-rumor:
    name: 'Слух'
    summary: 'Цель соглашается с одним утверждением алхимика и считает, что это её собственное мнение.'
thin-blood-alchemy-tank:
    name: 'Танк'
    summary: 'Первый урон, полученный алхимиком в сцене, уменьшается на пять.'
thin-blood-alchemy-chemically-induced-flashback:
    name: 'Химический флешбэк'
    summary: 'Эш с вещами погибшего вампира позволяет пережить одно из его воспоминаний.'
thin-blood-alchemy-concoct-ashe:
    name: 'Приготовление Эша'
    summary: 'Превращает прах уничтоженного вампира в Эш — вызывающий зависимость наркотик, ненадолго усиливающий кровь.'
thin-blood-alchemy-airborne-momentum:
    name: 'Воздухоплавание'
    summary: 'На сцену алхимик может летать или парить со скоростью бега, неся груз весом с человека.'
thin-blood-alchemy-short-circuit:
    name: 'Короткое замыкание'
    summary: 'Прикосновение бесшумно выводит из строя электрооборудование, от машины до питания здания.'
thin-blood-alchemy-toxic-personality:
    name: 'Токсичная личность'
    summary: 'Алхимик выделяет едкую желчь, усиливающую удары без оружия; её можно и выплюнуть во врага.'
thin-blood-alchemy-discipline-channeling:
    name: 'Направление Дисциплины'
    summary: 'Такой Эш на главу даёт одну силу Дисциплины, которой владел уничтоженный вампир.'
thin-blood-alchemy-awaken-the-sleeper:
    name: 'Пробуждение спящего'
    summary: 'Эликсир, добавленный в человеческую кровь, пробуждает вампира из торпора.'
thin-blood-alchemy-flowering-amaranth:
    name: 'Цветущий амарант'
    summary: 'Совместная диаблери: слабокровные получают точку одной из клановых Дисциплин полнокровного вампира.'
thin-blood-alchemy-moment-of-clarity:
    name: 'Момент ясности'
    summary: 'Зверь на сцену затихает: бонус к Ментальным проверкам и защите от ментальных сил, нет безумия.'
