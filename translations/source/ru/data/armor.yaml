armored-clothing:
    name: Бронированная одежда
    notes: Лёгкие пластины, вшитые в обычную одежду. Не даёт бонуса АР, но минимально защищает.
blast-vest-helmet:
    name: Противоударный жилет и шлем
    notes: Базовая защита. Добавляет кости к поглощению Выносливостью.
flight-suit:
    name: Лётный костюм
    notes: Костюм пилота. Герметичен, аварийный запас кислорода на 30 минут.
combat-jumpsuit:
    name: Боевой комбинезон
    notes: Гибкая боевая форма. Незаметна, не мешает движению.
bounty-hunter-armor:
    name: Броня охотника за головами
    notes: Тяжёлая боевая броня. Снижает запасы Ловкости.
armored-flightsuit:
    name: Бронированный лётный костюм
    notes: Лётный костюм со встроенными бронепластинами. Снижает Ловкость.
light-combat-armor:
    name: Лёгкая боевая броня
    notes: Армейские лёгкие пластины. Баланс защиты и подвижности.
stormtrooper-armor:
    name: Броня штурмовика
    notes: Имперское снаряжение. Наивысший АР и самый большой штраф. В продаже не встречается.
heavy-combat-armor:
    name: Тяжёлая боевая броня
    notes: Пластины на всё тело. Очень большой штраф к Ловкости.
mandalorian-armor:
    name: Мандалорская броня
    notes: Легендарный сплав бескар. Превосходная защита без громоздкости. Повреждается только световым мечом.
jedi-robes:
    name: Одеяния джедая
    notes: Традиционная одежда джедаев. Не даёт АР, но может слегка защищать от энергии.
