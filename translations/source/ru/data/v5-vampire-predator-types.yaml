alleycat:
    name: 'Разбойник'
    summary: 'Берёт кровь силой: выслеживает, одолевает, пьёт и исчезает.'
    grants: 'Специализация: Запугивание (Ограбление) или Рукопашный бой (Захваты). +1 точка Стремительности или Мощи. Человечность -1. Связи 3 (криминальный мир).'
bagger:
    name: 'Упаковщик'
    summary: 'Не охотится, а добывает пакетную или холодную кровь кражей, покупкой или через знакомства.'
    grants: 'Специализация: Воровство (Взлом) или Уличное чутьё (Чёрный рынок). +1 точка Кровавой магии (Тремер, Бану Хаким) или Затемнения. Железный желудок (3). Недостаток Враг (2). Не для Вентру.'
blood-leech:
    name: 'Пиявка'
    summary: 'Питается другими вампирами — охотой, принуждением или как платой; запретная диета.'
    grants: 'Специализация: Рукопашный бой или Скрытность (Сородичи). +1 к Стремительности или Превращению. Человечность -1. Сила крови +1. Тёмный секрет: диаблерист (2) или Отверженный (2). Неподходящая добыча: смертные (2).'
cleaver:
    name: 'Семьянин'
    summary: 'Тайно питается от смертной семьи или круга друзей, с которыми всё ещё близок.'
    grants: 'Специализация: Убеждение (Промывка мозгов) или Притворство (Устранение улик). +1 точка Доминирования или Анимализма. Тёмный секрет: Семьянин (1). Стадо (2).'
consensualist:
    name: 'Торговец'
    summary: 'Пьёт только с согласия — под видом сбора крови, игры или честного признания.'
    grants: 'Специализация: Медицина (Кровопускание) или Убеждение (Жертвы). +1 точка Ясновидения или Стойкости. Человечность +1. Тёмный секрет: нарушитель Маскарада (1). Неподходящая добыча: несогласные (1).'
farmer:
    name: 'Фермер'
    summary: 'Отказывается от человеческой крови и живёт животными, борясь с постоянным Голодом.'
    grants: 'Специализация: Знание животных (конкретный вид) или Выживание (Охота). +1 точка Анимализма или Превращения. Человечность +1. Недостаток Веган (2). Не для Вентру и Силы крови 3+.'
osiris:
    name: 'Осирис'
    summary: 'Питается обожающими последователями: фанатами, паствой или культом.'
    grants: 'Специализация: Оккультизм (традиция) или Исполнение (область). +1 точка Кровавой магии (Тремер, Бану Хаким) или Внушительности. 3 точки между Славой и Стадом. 2 точки между Врагами и Мифическими недостатками.'
sandman:
    name: 'Кошмар'
    summary: 'Пробирается к спящим и пьёт, не будя их.'
    grants: 'Специализация: Медицина (Анестезия) или Скрытность (Проникновение). +1 точка Ясновидения или Затемнения. Ресурсы (1).'
scene-queen:
    name: 'Звезда'
    summary: 'Царит в субкультуре, которая считает его своим и охотно отдаёт кровь.'
    grants: 'Специализация: Этикет, Лидерство или Уличное чутьё (своя тусовка). +1 точка Доминирования или Мощи. Слава (1). Связи (1). Нелюбимый вне тусовки (1) или Неподходящая добыча: другая субкультура (1).'
siren:
    name: 'Сирена'
    summary: 'Питается во время настоящей или мнимой близости, пряча укус за соблазнением.'
    grants: 'Специализация: Убеждение или Притворство (Соблазнение). +1 точка Стойкости или Внушительности. Внешность: Красота (2). Враг (1): отвергнутый любовник или ревнивый партнёр.'
extortionist:
    name: 'Вымогатель'
    summary: 'Требует кровь как плату за защиту или услуги — нужные или выдуманные.'
    grants: 'Специализация: Запугивание (Принуждение) или Воровство (Охранные системы). +1 точка Доминирования или Мощи. 3 точки между Связями и Ресурсами. Враг (2): полиция или сбежавшая жертва.'
graverobber:
    name: 'Расхититель могил'
    summary: 'Пьёт из свежих трупов и скорбящих в моргах, больницах и на кладбищах.'
    grants: 'Специализация: Оккультизм (Погребальные обряды) или Медицина (Трупы). +1 точка Стойкости или Забвения. Железный желудок (3). Убежище (1). Недостаток Стада: Явный хищник (2).'
grim-reaper:
    name: 'Мрачный жнец'
    summary: 'Питается только умирающими, кочуя между хосписами и домами престарелых.'
    grants: 'Специализация: Бдительность (Смерть) или Воровство (Подделка). +1 точка Ясновидения или Забвения. Союзники или Влияние (1) в медицине. Человечность +1. Неподходящая добыча: здоровые смертные (1).'
montero:
    name: 'Монтеро'
    summary: 'Использует слуг как загонщиков, гонящих добычу прямо к нему.'
    grants: 'Специализация: Лидерство (Охотничья свора) или Скрытность (Засада). +1 точка Доминирования или Затемнения. Слуги (2). Человечность -1.'
pursuer:
    name: 'Преследователь'
    summary: 'Изучает и выслеживает жертву, которую никто не хватится, прежде чем напасть.'
    grants: 'Специализация: Расследование (Профилирование) или Скрытность (Слежка). +1 точка Анимализма или Ясновидения. Чутьё на кровь (1). Связи (1) среди завсегдатаев охотничьих угодий. Человечность -1.'
trapdoor:
    name: 'Западня'
    summary: 'Строит логово, заманивающее добычу внутрь, где питается не торопясь.'
    grants: 'Специализация: Убеждение (Маркетинг) или Скрытность (Засады или Ловушки). +1 точка Превращения или Затемнения. Убежище (1). Слуги (1), Стадо (1) или вторая точка Убежища. Недостаток: Жуткое или Населённое призраками (1).'
