animalism-bond-famulus:
    name: 'Кровавый фамулус'
    summary: 'Поите животное своей кровью три ночи, и оно станет верным фамулусом; облегчает прочий Анимализм на нём. Пул: Харизма + Знание животных'
animalism-sense-the-beast:
    name: 'Чутьё на Зверя'
    summary: 'Чуете враждебность и Зверя в других, распознаёте сверхъестественное. Пул: Решительность + Анимализм против Самообладания + Притворства'
animalism-feral-whispers:
    name: 'Звериный шёпот'
    summary: 'Общение с одним видом животных, призыв и просьбы о помощи; с фамулусом бесплатно. Пул: Манипулирование/Харизма + Анимализм'
animalism-animal-succulence:
    name: 'Сочная кровь'
    summary: 'Кровь животных утоляет больше Голода, чем обычно, и Сила крови меньше мешает так питаться.'
animalism-quell-the-beast:
    name: 'Укрощение Зверя'
    summary: 'Взглядом гасите агрессию: смертные впадают в апатию, вампиры успокаиваются. Пул: Харизма + Анимализм против Выносливости + Решительности'
animalism-unliving-hive:
    name: 'Мёртвый улей'
    summary: 'Анимализм действует на рои насекомых, и они могут гнездиться в вашем теле; рой может стать фамулусом.'
animalism-subsume-the-spirit:
    name: 'Подчинение духа'
    summary: 'Покидаете тело и вселяетесь в животное, управляя им; с фамулусом бесплатно. Пул: Манипулирование + Анимализм'
animalism-animal-dominion:
    name: 'Звериные владения'
    summary: 'Командуете целой стаей животных одного вида на сцену или одно поручение. Пул: Харизма + Анимализм'
animalism-drawing-out-the-beast:
    name: 'Извлечение Зверя'
    summary: 'Вместо сопротивления передаёте своё бешенство или ужас тому, кто рядом. Пул: Смекалка + Анимализм против Самообладания + Решительности'
animalism-animal-messenger:
    name: 'Звериный вестник'
    summary: 'Фамулус доносит устное послание из одной фразы до указанного человека и при нужде выслеживает его. Проверка жажды за ночь.'
animalism-messengers-command:
    name: 'Приказ вестника'
    summary: 'Фамулус-вестник передаёт цели приказ Подчинения или Гипноза, встретившись с ней взглядом.'
animalism-plague-of-beasts:
    name: 'Звериная напасть'
    summary: 'Животные изводят цель всю ночь: штраф к Навыкам, её легче выследить. Пул: Манипулирование + Анимализм против Самообладания + Знания животных'
animalism-sway-the-flock:
    name: 'Власть над стаей'
    summary: 'На ночь задаёте настроение всем животным в округе — от сонливости до ярости. Пул: Самообладание + Анимализм'
animalism-coax-the-bestial-temper:
    name: 'Нрав Зверя'
    summary: 'Напевая, повышаете или понижаете сложность сопротивления безумию для всех вампиров поблизости. Пул: Манипулирование + Анимализм'
auspex-heightened-senses:
    name: 'Обострённые чувства'
    summary: 'Ясновидение прибавляется к проверкам восприятия, чувства за гранью человеческих; перегрузка ослепляет. Пул: Смекалка + Решительность'
auspex-sense-the-unseen:
    name: 'Потустороннее зрение'
    summary: 'Замечаете скрытое сверхъестественное: Затемнение, призраков, слежку, спящую магию. Пул: Смекалка или Решительность + Ясновидение'
auspex-premonition:
    name: 'Предвидение'
    summary: 'Внезапные озарения подсказывают об опасности или уликах; можно вызвать нарочно за проверку жажды. Пул: Решительность + Ясновидение'
auspex-scry-the-soul:
    name: 'Постижение душ'
    summary: 'Читаете ауру цели: настроение, природа, диаблери, сверхъестественное. Пул: Интеллект + Ясновидение против Самообладания + Притворства'
auspex-share-the-senses:
    name: 'Общее восприятие'
    summary: 'Подключаетесь к чувствам того, кто пил вашу кровь, или чью кровь пили вы. Пул: Решительность + Ясновидение'
auspex-spirits-touch:
    name: 'Астральное прикосновение'
    summary: 'Касаясь предмета или места, считываете оставленные на нём эмоции и события. Пул: Интеллект + Ясновидение'
auspex-clairvoyance:
    name: 'Экстрасенсорное видение'
    summary: 'Интуитивно узнаёте, что происходит вокруг, вплоть до городского района. Пул: Интеллект + Ясновидение'
auspex-possession:
    name: 'Одержимость'
    summary: 'Захватываете тело смертного, пока ваше лежит беспомощным. Пул: Решительность + Ясновидение против Решительности + Интеллекта'
auspex-telepathy:
    name: 'Телепатия'
    summary: 'Передаёте мысли и читаете мысли и воспоминания цели; на вампиров — с Волей. Пул: Решительность + Ясновидение против Смекалки + Притворства'
auspex-panacea:
    name: 'Панацея'
    summary: 'Успокаиваете разум другого, исцеляя урон Воле и умиротворяя смертных. Пул: Самообладание + Ясновидение'
auspex-reveal-temperament:
    name: 'Чтение темперамента'
    summary: 'Чуете Резонанс и дискразии смертного или последней жертвы вампира. Пул: Интеллект + Ясновидение против Самообладания + Притворства'
auspex-fatal-flaw:
    name: 'Роковой изъян'
    summary: 'Находите слабейшую защиту цели и получаете бонус против неё. Пул: Интеллект + Ясновидение против Самообладания/Выносл. + Притворства'
auspex-unburdening-the-bestial-soul:
    name: 'Очищение падшей души'
    summary: 'За сцену снимаете Пятна с другого вампира или защищаете от новых; вы получаете Пятно. Пул: Самообладание + Ясновидение против Человечности'
celerity-cats-grace:
    name: 'Кошачья грация'
    summary: 'Вы без проверок удерживаете равновесие на узких карнизах, проводах и подобных опорах.'
celerity-rapid-reflexes:
    name: 'Стремительные рефлексы'
    summary: 'Защищаетесь от стрельбы без укрытия без штрафа и совершаете дополнительное малое действие за ход.'
celerity-fleetness:
    name: 'Подвижность'
    summary: 'Стремительность прибавляется к небоевым проверкам Ловкости и раз в ход к защите.'
celerity-blink:
    name: 'Молниеносность'
    summary: 'За ход преодолеваете по прямой около 50 метров и действуете по прибытии. Пул: Ловкость + Атлетика'
celerity-traversal:
    name: 'Лёгкий шаг'
    summary: 'Бежите по стене или по жидкости на небольшое расстояние. Пул: Ловкость + Атлетика'
celerity-draught-of-elegance:
    name: 'Глоток изящества'
    summary: 'Тот, кто пьёт вашу кровь, получает на время половину вашей Стремительности и её силы.'
celerity-unerring-aim:
    name: 'Феноменальная точность'
    summary: 'Мир замедляется для одной дальнобойной атаки, от которой цель не может защититься.'
celerity-lightning-strike:
    name: 'Молниеносный удар'
    summary: 'Наносите в ближнем бою один удар настолько быстро, что от него нельзя защититься.'
celerity-split-second:
    name: 'Доля секунды'
    summary: 'Переписываете описание Рассказчика, успевая отреагировать первым в пределах нескольких секунд.'
celerity-rush-job:
    name: 'Спешная работа'
    summary: 'Выполняете долгие задачи Навыков за секунды и часть полных действий как малые; не для боя.'
celerity-weaving:
    name: 'Лавирование'
    summary: 'Пул не уменьшается при уклонении от нескольких выстрелов, к уклонению прибавляется Стремительность.'
celerity-blurred-momentum:
    name: 'Размытый силуэт'
    summary: 'Атаки с числом успехов ниже вашей Стремительности промахиваются, даже внезапные. Проверка жажды каждый ход.'
celerity-unseen-strike:
    name: 'Незримый удар'
    summary: 'Исчезаете, рывком настигаете врага и бьёте как при внезапной атаке. Пул: Ловкость + Стремительность против Смекалки + Бдительности'
dominate-cloud-memory:
    name: 'Забвение'
    summary: 'Цель забывает последние мгновения. Пул: Харизма + Доминирование против Смекалки + Решительности'
dominate-compel:
    name: 'Подчинение'
    summary: 'Короткий приказ из одного слова, исполняемый немедленно. Пул: Харизма + Доминирование против Интеллекта + Решительности'
dominate-mesmerize:
    name: 'Гипноз'
    summary: 'Отдаёте сложный приказ, который цель выполняет. Пул: Манипулирование + Доминирование против Интеллекта + Решительности'
dominate-dementation:
    name: 'Помешательство'
    summary: 'Разговором доводите цель до безумия, вызывая видения и страхи. Пул: Манипулирование + Доминирование против Самообладания + Интеллекта'
dominate-the-forgetful-mind:
    name: 'Забывчивый разум'
    summary: 'В беседе переписываете воспоминания цели. Пул: Манипулирование + Доминирование против Интеллекта + Решительности'
dominate-submerged-directive:
    name: 'Подсознательный импульс'
    summary: 'Приказы Гипноза могут дремать до заданного условия-триггера.'
dominate-rationalize:
    name: 'Рационализация'
    summary: 'Жертвы считают действия под Доминированием собственным выбором.'
dominate-mass-manipulation:
    name: 'Управление массами'
    summary: 'Применяете другую силу Доминирования на целую группу, видящую ваши глаза; бросок против сильнейшего.'
dominate-terminal-decree:
    name: 'Смертный приговор'
    summary: 'Приказы могут толкать жертв к самоувечью и смерти; они сопротивляются, а не отвергают их сразу.'
dominate-slavish-devotion:
    name: 'Рабская преданность'
    summary: 'Чужое Доминирование на ваших подвластных получает штраф, равный вашей Стойкости.'
dominate-domitors-favor:
    name: 'Милость домитора'
    summary: 'На месяц связанным узами слугам труднее идти против вас, и тратить Волю на это нельзя.'
dominate-ancestral-dominion:
    name: 'Власть предка'
    summary: 'Повелеваете вампиром своей линии крови без взгляда и слов. Пул: Манипулирование + Доминирование против Решительности + Оккультизма'
dominate-implant-suggestion:
    name: 'Внушение'
    summary: 'На сцену меняете мнение или желание цели. Пул: Манипулирование + Доминирование против Самообладания + Решительности'
fortitude-resilience:
    name: 'Сопротивление'
    summary: 'Прибавляете Стойкость к шкале Здоровья.'
fortitude-unswayable-mind:
    name: 'Непокорный разум'
    summary: 'Прибавляете Стойкость к сопротивлению принуждению, контролю разума и Доминированию.'
fortitude-toughness:
    name: 'Несокрушимость'
    summary: 'Вычитаете Стойкость из поверхностного урона до его деления пополам.'
fortitude-enduring-beasts:
    name: 'Адские гончие'
    summary: 'Фамулус или другие животные получают доп. Здоровье по вашей Стойкости; прочие — за проверку жажды. Пул: Выносливость + Анимализм'
fortitude-defy-bane:
    name: 'Преодоление проклятия'
    summary: 'Превращаете тяжёлый урон, включая огонь и солнце, в поверхностный; можно рефлекторно. Пул: Смекалка + Выживание'
fortitude-fortify-the-inner-facade:
    name: 'Внутренняя защита'
    summary: 'Силам, читающим ваш разум или ауру, труднее: выше сложность или Стойкость к сопротивлению.'
fortitude-draught-of-endurance:
    name: 'Глоток стойкости'
    summary: 'Тот, кто пьёт вашу кровь, получает на время половину вашей Стойкости и её силы.'
fortitude-flesh-of-marble:
    name: 'Мраморная плоть'
    summary: 'Игнорируете первый источник физического урона каждый ход, включая огонь, но не солнце.'
fortitude-prowess-from-pain:
    name: 'Сила в боли'
    summary: 'Нет штрафов от ран, каждый уровень урона повышает Физический Атрибут (с пределом по Приливу крови).'
fortitude-earths-perseverance:
    name: 'Твердь земли'
    summary: 'Становитесь недвижимым: сдвинуть вас нельзя, пока вы сами не пойдёте.'
fortitude-invigorating-vitae:
    name: 'Животворящая витэ'
    summary: 'Ваша кровь лучше лечит живых: три тяжёлых повреждения за проверку жажды вместо одного.'
fortitude-valeren:
    name: 'Валерен'
    summary: 'Силой своей Крови исцеляете урон Здоровью другого вампира. Пул: Интеллект + Стойкость'
fortitude-gorgons-scales:
    name: 'Чешуя горгоны'
    summary: 'Защита по Резонансу последней кормёжки: от кола, огня, Ясновидения или солнца.'
obfuscate-cloak-of-shadows:
    name: 'Тёмный покров'
    summary: 'Остаётесь незамеченным, пока неподвижны в укрытии или тени.'
obfuscate-silence-of-death:
    name: 'Бесшумная смерть'
    summary: 'Глушите все звуки, которые издаёте.'
obfuscate-unseen-passage:
    name: 'Незримый проход'
    summary: 'Перемещаетесь незамеченным, если не привлекаете внимания.'
obfuscate-ghost-in-the-machine:
    name: 'Призрак в машине'
    summary: 'Затемнение обманывает и камеры, записи и видеотрансляции.'
obfuscate-mask-of-a-thousand-faces:
    name: 'Маска тысячи лиц'
    summary: 'Выглядите как ничем не примечательный незнакомец по вашему выбору.'
obfuscate-conceal:
    name: 'Маскировка'
    summary: 'Скрываете от внимания предмет размером вплоть до дома. Пул: Интеллект + Затемнение'
obfuscate-vanish:
    name: 'Исчезновение'
    summary: 'Используете Тёмный покров или Незримый проход даже под наблюдением. Пул: Смекалка + Затемнение против Смекалки + Бдительности'
obfuscate-cloak-the-gathering:
    name: 'Всеобщий покров'
    summary: 'Распространяете силы Затемнения на спутников.'
obfuscate-impostors-guise:
    name: 'Маска самозванца'
    summary: 'Изучив человека, принимаете его облик. Пул: Смекалка + Затемнение; Манипулирование + Исполнение'
obfuscate-chimerstry:
    name: 'Фантасмагория'
    summary: 'Краткая галлюцинация для одного чувства отвлекает зрителей, даже в бою. Пул: Манипулирование + Затемнение против Самообладания + Смекалки'
obfuscate-fata-morgana:
    name: 'Фата-моргана'
    summary: 'Создаёте сложную безвредную галлюцинацию для нескольких чувств на сцену. Пул: Манипулирование + Затемнение'
obfuscate-mental-maze:
    name: 'Лабиринт разума'
    summary: 'Жертва теряет ориентацию и не может найти выход из здания. Пул: Харизма + Затемнение против Смекалки + Решительности'
obfuscate-mind-masque:
    name: 'Маска разума'
    summary: 'Подсовываете ложную личность тем, кто читает ваш разум или ауру. Пул: Интеллект + Затемнение'
potence-lethal-body:
    name: 'Смертоносное тело'
    summary: 'Пассивно: удары без оружия могут наносить смертным тяжёлые повреждения и игнорируют 1 пункт брони за точку Мощи.'
potence-soaring-leap:
    name: 'Далёкий прыжок'
    summary: 'Пассивно: прыжок без разбега на 3 м в высоту и 5 м в длину за каждую точку Мощи.'
potence-prowess:
    name: 'Сокрушение'
    summary: 'На сцену: Мощь прибавляется к урону без оружия и к проверкам Силы на силовые действия.'
potence-relentless-grasp:
    name: 'Неразжимная хватка'
    summary: 'На сцену: Мощь добавляется автоматическими успехами к попыткам удержать что-либо, включая захват.'
potence-brutal-feed:
    name: 'Кровавое пиршество'
    summary: 'Осушает смертного примерно за ход; каждый утолённый Голод наносит жертве 1 тяжёлое (вампиру — поверхностное) повреждение.'
potence-spark-of-rage:
    name: 'Искра ярости'
    summary: 'Мощь к подстрекательству к насилию или вампир проверяет ярость (сл. 3). Манипулирование + Мощь против Самообладания + Интеллекта.'
potence-uncanny-grip:
    name: 'Железная хватка'
    summary: 'На сцену: автоматически взбирается по большинству неметаллических поверхностей и висит на стенах и потолке, оставляя следы.'
potence-wrecker:
    name: 'Крушитель'
    summary: 'Требует Сокрушения. При разрушении неодушевлённых предметов Сокрушение учитывает Мощь дважды.'
potence-draught-of-might:
    name: 'Глоток мощи'
    summary: 'Выпивший кровь вампира на время получает силы Мощи до половины её уровня у донора (с округлением вниз).'
potence-crash-down:
    name: 'Сокрушительное приземление'
    summary: 'Требует Далёкого прыжка. Приземление бьёт всех в радиусе 3 м; Сила + Мощь против Ловкости + Атлетики, может сбить с ног.'
potence-earthshock:
    name: 'Землетрясение'
    summary: 'Раз за сцену удар оземь сбивает с ног всех в радиусе 5 м; устоять — Ловкость + Атлетика (сл. 3).'
potence-fist-of-caine:
    name: 'Кулак Каина'
    summary: 'На сцену: атаки в Драке наносят тяжёлые повреждения и смертным, и сверхъестественным существам.'
potence-subtle-hammer:
    name: 'Незримый молот'
    summary: 'Пассивно: удары без оружия и силовые действия становятся малыми действиями на 2 кубика, раз за ход.'
presence-awe:
    name: 'Восхищение'
    summary: 'Внушительность к Убеждению, Исполнению и прочим проверкам обаяния; осознающие могут сопротивляться Самообладанием + Интеллектом.'
presence-daunt:
    name: 'Отторжение'
    summary: 'Внушительность к Запугиванию; чтобы напасть, нужна проверка Решительности + Самообладания (сл. 2). Не вместе с Восхищением.'
presence-eyes-of-the-serpent:
    name: 'Глаза змея'
    summary: 'Взгляд сковывает смертного; вампира — при Харизме + Внушительности против Сообразительности + Самообладания, он может вырваться Силой воли.'
presence-lingering-kiss:
    name: 'Долгий поцелуй'
    summary: 'Укушенные смертные жаждут Поцелуя; Внушительность к пулам Харизмы против них, пока жертва не освободится Силой воли.'
presence-melpominee:
    name: 'Мельпомена'
    summary: 'Восхищение, Отторжение, Жуткий взгляд, Очарование и Величие действуют одним голосом на всех, кто слышит; не через запись.'
presence-dread-gaze:
    name: 'Жуткий взгляд'
    summary: 'Оскал вселяет ужас в одну цель: бегство или оцепенение. Харизма + Внушительность против Самообладания + Решительности.'
presence-entrancement:
    name: 'Очарование'
    summary: 'Цель на часы влюбляется; Внушительность к социальным пулам против неё. Харизма + Внушительность против Самообладания + Сообразительности.'
presence-thrown-voice:
    name: 'Брошенный голос'
    summary: 'На сцену: голос звучит из любой видимой точки или остаётся в месте, продолжая манить или пугать.'
presence-true-loves-face:
    name: 'Лик истинной любви'
    summary: 'Смертный видит в вампире близкого человека. Манипулирование + Внушительность против Самообладания + Сообразительности.'
presence-irresistible-voice:
    name: 'Соблазнительный голос'
    summary: 'Пассивно: для Доминирования достаточно одного голоса вампира; не действует через телефон или запись.'
presence-summon:
    name: 'Призыв'
    summary: 'Зовёт того, кто испытал Внушительность или пил вашу кровь. Манипулирование + Внушительность против Самообладания + Интеллекта.'
presence-suffuse-the-edifice:
    name: 'Пропитать здание'
    summary: 'Восхищение, Отторжение или Величие распространяются на здание: действуют на всех внутри и смотрящих на него.'
presence-majesty:
    name: 'Величие'
    summary: 'Никто не может действовать против вампира, кроме самозащиты. Харизма + Внушительность против Самообладания + Решительности.'
presence-star-magnetism:
    name: 'Звёздная притягательность'
    summary: 'Восхищение, Отторжение и Очарование действуют через прямую трансляцию или телефон; одна дополнительная проверка жажды.'
protean-eyes-of-the-beast:
    name: 'Глаза зверя'
    summary: 'Светящиеся глаза видят в полной (даже сверхъестественной) темноте; +2 кубика к Запугиванию смертных.'
protean-weight-of-the-feather:
    name: 'Лёгкость пера'
    summary: 'Почти невесомость: иммунитет к урону от падений, столкновений и бросков. Внезапно — Смекалка + Выживание (сл. 3).'
protean-feral-weapons:
    name: 'Врождённое оружие'
    summary: 'На сцену: когти или клыки, +2 к урону в Драке, тяжёлые повреждения смертным, поверхностные не делятся пополам.'
protean-vicissitude:
    name: 'Преображение'
    summary: 'Перекраивает свою плоть: перенос физических точек, оружие, броня, внешность. Упорство + Превращение; изменение стоит точку.'
protean-earth-meld:
    name: 'Слияние с твердью'
    summary: 'Погружается в естественную почву на день, сохраняя восприятие во время бодрствования; вещи остаются наверху.'
protean-shapechange:
    name: 'Смена облика'
    summary: 'Принимает облик одного животного схожего размера, получая его физические характеристики, чувства и ограничения.'
protean-fleshcrafting:
    name: 'Изменение плоти'
    summary: 'Требует Преображения. Изменения Преображения на чужом теле. Против воли: Упорство + Превращение против Выносливости + Решительности.'
protean-metamorphosis:
    name: 'Метаморфозис'
    summary: 'Требует Смены облика. Второй облик животного любого размера: летучая мышь, крыса, змея.'
protean-horrid-form:
    name: 'Чудовищный облик'
    summary: 'Требует Преображения. Облик чудовища с бесплатными изменениями по уровню Превращения; любой критический успех — грязный.'
protean-mist-form:
    name: 'Живая мгла'
    summary: 'Превращение в туман за три хода (быстрее за доп. проверки жажды, до трёх); вредят лишь огонь, солнце и магия.'
protean-the-unfettered-heart:
    name: 'Свободное сердце'
    summary: 'Пассивно: сердце перемещается в груди; пронзить его колом гораздо труднее, а кол можно вытолкнуть.'
protean-one-with-the-land:
    name: 'Единение с землёй'
    summary: 'Требует Слияния с твердью. Сливается с любой поверхностью и ощущает события в радиусе около 1 км через животных.'
protean-the-heart-of-darkness:
    name: 'Сердце тьмы'
    summary: 'Извлекает и хранит своё сердце: иммунитет к колу, +2 против безумия, -2 к Раскаянию; стоит 2 тяжёлых повреждения.'
blood-sorcery-corrosive-vitae:
    name: 'Едкая кровь'
    summary: 'Пролитая кровь разъедает неживое вещество, около 35 см за проверку жажды за минуты; сталь лишь покрывается раковинами.'
blood-sorcery-a-taste-for-blood:
    name: 'Проба крови'
    summary: 'По вкусу крови узнаёт резонанс, тип существа и Силу крови. Решительность + Кровавая магия (сл. 3).'
blood-sorcery-extinguish-vitae:
    name: 'Приглушение крови'
    summary: 'Повышает Голод видимого вампира на 1 (2 при триумфе). Интеллект + Кровавая магия против Выносливости + Самообладания.'
blood-sorcery-scour-secrets:
    name: 'Кровавый поиск'
    summary: 'Кровь быстро прочёсывает тексты в поисках нужных сведений. Интеллект + Кровавая магия, сложность по скрытности.'
blood-sorcery-blood-of-potency:
    name: 'Мощная кровь'
    summary: 'Временно повышает Силу крови на 1 (2 при триумфе), даже выше предела поколения. Решительность + Кровавая магия.'
blood-sorcery-scorpions-touch:
    name: 'Жало скорпиона'
    summary: 'Кровь становится контактным ядом для клинка или плевка. Сила + Кровавая магия против Выносливости + Оккультизма или Стойкости.'
blood-sorcery-theft-of-vitae:
    name: 'Податливая кровь'
    summary: 'Вскрывает артерию смертного и пьёт издали. Сообразительность + Кровавая магия против Сообразительности + Оккультизма.'
blood-sorcery-blood-aegis:
    name: 'Кровавая эгида'
    summary: 'Парящая завеса крови снижает урон от дальних атак на 5 за каждую проверку жажды, до конца сцены.'
blood-sorcery-baals-caress:
    name: 'Немилость Баала'
    summary: 'Как Жало скорпиона, но наносит тяжёлые повреждения всем, убивает смертных и может ввергнуть вампира в торпор.'
blood-sorcery-cauldron-of-blood:
    name: 'Кровавый котёл'
    summary: 'Кровь жертвы вскипает: тяжёлые повреждения, Пятна. Решительность + Кровавая магия против Самообладания + Оккультизма.'
oblivion-ashes-to-ashes:
    name: 'Прах к праху'
    summary: 'Витэ растворяет труп; оживлённый сопротивляется. Выносливость + Забвение против Выносливости + Медицины или Стойкости.'
oblivion-the-binding-fetter:
    name: 'Связующие оковы'
    summary: 'На сцену: ощущает предметы и места, удерживающие призраков; -2 к проверкам Ловкости и Сообразительности. Сообразительность + Забвение.'
oblivion-oblivions-sight:
    name: 'Взор Забвения'
    summary: 'На сцену: чёрные глаза видят во тьме и замечают нескрывающихся призраков; -2 к социальным проверкам со смертными.'
oblivion-shadow-cloak:
    name: 'Покров тени'
    summary: 'Пассивно: тени скрывают вампира, +2 кубика к Скрытности и к Запугиванию смертных.'
oblivion-arms-of-ahriman:
    name: 'Руки Аримана'
    summary: 'Теневые руки бьют или хватают далёкие цели, пока вампир сосредоточен. Сообразительность + Забвение, +половина Мощи к урону.'
oblivion-fatal-prediction:
    name: 'Роковое предсказание'
    summary: 'Смертный за сутки получит тяжёлые повреждения по перевесу. Решительность + Забвение против Сообразительности + Оккультизма.'
oblivion-shadow-cast:
    name: 'Отбросить тень'
    summary: 'Создаёт сверхъестественную тень для других сил; стоящие в ней получают +1 урон Силе воли.'
oblivion-where-the-veil-thins:
    name: 'Где истончается завеса'
    summary: 'Определяет, насколько тонка завеса между мирами; без этого её истончение не помогает. Интеллект + Забвение (сл. 3).'
oblivion-fatal-precognition:
    name: 'Роковое предвидение'
    summary: 'Видение смерти не-вампира; помешать ей становится труднее. Решительность + Забвение (сл. 3+).'
oblivion-aura-of-decay:
    name: 'Аура тлена'
    summary: 'На сцену: гниль вокруг на 5 м — растения гибнут, еда портится, живые болеют. Выносливость + Забвение против Выносливости + Медицины.'
oblivion-passion-feast:
    name: 'Пир страстей'
    summary: 'Питается страстями призрака, снижая Голод. Решительность + Забвение против Решительности + Самообладания.'
oblivion-shadow-perspective:
    name: 'Взгляд из тени'
    summary: 'До конца сцены незаметно видит и слышит через любую тень в пределах видимости.'
oblivion-shadow-servant:
    name: 'Теневой слуга'
    summary: 'Отделяет часть своей тени — безвольного слугу для слежки и запугивания; яркий свет его изгоняет.'
oblivion-touch-of-oblivion:
    name: 'Касание Забвения'
    summary: 'Касание иссушает плоть: 2 тяжёлых повреждения и увечье. Против уклоняющейся цели — Сила + Драка.'
oblivion-necrotic-plague:
    name: 'Некротическая чума'
    summary: 'Касанием заражает смертного сверхъестественной болезнью: тяжёлые повреждения каждую сцену. Интеллект + Забвение.'
oblivion-stygian-shroud:
    name: 'Стигийский покров'
    summary: 'Тьма покрывает область: -3 кубика всем внутри, смертные получают поверхностные повреждения каждый ход.'
oblivion-shadow-step:
    name: 'Шаг сквозь тень'
    summary: 'Входит в тень и через ход выходит из другой в пределах видимости, может взять с собой спутника.'
oblivion-skuld-fulfilled:
    name: 'Исполнение Скульд'
    summary: 'Возвращает перенесённую болезнь или травму либо лишает гуля защиты от старения. Выносливость + Забвение против Выносливости ×2.'
oblivion-tenebrous-avatar:
    name: 'Аватар тьмы'
    summary: 'Становится живой тенью: скользит по поверхностям, окутывает жертв, уязвим лишь для огня и солнца.'
oblivion-withering-spirit:
    name: 'Иссушение духа'
    summary: 'Касание губит дух: 2 тяжёлых урона Силе воли за перевес, Пятна. Решительность + Забвение против Решительности + Оккультизма.'
