control:
    name: Контроль
    shortDescription: Сила направляет ваше тело и поступки
    specialties:
        - Сосредоточенный
        - Собранный
        - Спокойный
        - Терпеливый
        - Безмятежный
        - Дисциплинированный
        - Непоколебимый
        - Един с Силой
    scale:
        - Слабая связь — в критические мгновения вы чувствуете, как Сила направляет ваши инстинкты.
        - Осознанное доверие — сосредоточившись, вы позволяете Силе усиливать ваши действия.
        - Слияние с телом — вы исцеляетесь, игнорируете боль и усиливаете физические возможности.
        - Мастерство — продвинутое исцеление, стойкость к вреду, бой на световых мечах течёт сквозь вас.
        - Трансцендентность — вы поддерживаете себя за пределами обычных возможностей и действуете в совершенном Потоке.
dynamism:
    name: Динамизм
    shortDescription: Управление нематериальной энергией и самой Силой
    specialties:
        - Энергичный
        - Напряжённый
        - Яркий
        - Заряженный
        - Резонирующий
        - Неустойчивый
        - Ровный
        - Тихий
    scale:
        - Чувствительность к энергии — вы ощущаете энергетические поля, источники питания и потоки Силы вокруг.
        - Сдерживание — вы отражаете бластерные заряды и гасите небольшие энергетические разряды.
        - Проецирование — вы порождаете энергию (молнию ситхов), скрываете своё присутствие и погружаетесь в глубокую медитацию.
        - Мастерство — мощные энергетические атаки, поглощение и перенаправление входящей энергии.
        - Великий масштаб — вы влияете на бури, ядра реакторов и даже на сами нексусы Силы.
rapport:
    name: Связь
    shortDescription: Взаимодействие с живыми существами через Силу
    specialties:
        - Сопереживающий
        - Тёплый
        - Мягкий
        - Понимающий
        - Властный
        - Убедительный
        - Ободряющий
        - Проницательный
    scale:
        - Эмоциональная чуткость — вы ощущаете чувства окружающих и распознаёте ложь.
        - Влияние — вы успокаиваете эмоции и внушаете простые мысли слабым умам.
        - Взаимодействие разумов — вы читаете поверхностные мысли, передаёте свои мысли другим и зондируете память.
        - Глубокое влияние — вы подчиняете разумы, передаёте жизненную силу и исцеляете других.
        - Трансцендентные узы — вы перекраиваете разумы, создаёте прочные узы Силы и общаетесь через огромные расстояния.
sense:
    name: Чувство
    shortDescription: Наблюдение за вселенной через Силу
    specialties:
        - Бдительный
        - Восприимчивый
        - Чуткий
        - Интуитивный
        - Дальновидный
        - Наблюдательный
        - Внимательный
        - Видения
    scale:
        - Предчувствия — смутные ощущения об окружении и тонкое чутьё на опасность.
        - Осознанное восприятие — вы намеренно расширяете чувства; простое ясновидение на малом расстоянии.
        - Дальнее зрение — вы воспринимаете события на расстоянии, читаете поверхностные мысли, ощущаете возмущения.
        - Глубокое восприятие — вы видите сквозь обман, чувствуете скрытую правду и эхо прошлого.
        - Вселенское осознание — вам открываются прошлое, настоящее и будущее. От вас ничто не скрыто.
telekinesis:
    name: Телекинез
    shortDescription: Перемещение предметов силой мысли
    specialties:
        - Точный
        - Мощный
        - Тонкий
        - Контролируемый
        - Бережный
        - Грубый
        - Широкий
        - Филигранный
    scale:
        - Малые предметы — вы двигаете монеты, датапады или световые мечи. Требуется полная сосредоточенность.
        - Средние предметы — поднимаете и бросаете предметы весом до собственного тела. Отталкиваете врагов.
        - Тяжёлые предметы — швыряете обломки, сокрушаете цели, ненадолго поднимаете в воздух себя или других.
        - Крупные предметы — управляете транспортом, бросаете тяжёлую технику, осуществляете тонкий контроль.
        - Огромные предметы — двигаете объекты размером со звездолёт, создаёте телекинетические барьеры, сминаете шагоходы.
