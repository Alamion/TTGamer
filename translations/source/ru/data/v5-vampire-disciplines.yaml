animalism:
    name: 'Анимализм'
    summary: 'Родство со зверями и Зверем внутри: говорить с животными и повелевать ими, делить их чувства, гасить или будить безумие.'
auspex:
    name: 'Ясновидение'
    summary: 'Обострённые чувства и сверхъестественное восприятие: ауры, предчувствия, чтение предметов и мыслей.'
blood-sorcery:
    name: 'Кровавая магия'
    summary: 'Магия крови Тремер и Бану Хаким: витэ как оружие и инструмент, плюс ритуалы большего размаха.'
celerity:
    name: 'Стремительность'
    summary: 'Сверхъестественная скорость и реакция — от ловких рук до смазанного в движении силуэта.'
dominate:
    name: 'Доминирование'
    summary: 'Подчинение разума взглядом и голосом: приказы, переписанная память, власть над чужим телом.'
fortitude:
    name: 'Стойкость'
    summary: 'Неестественная выносливость: держать удары, противиться контролю разума, выдерживать даже огонь и солнце.'
obfuscate:
    name: 'Затемнение'
    summary: 'Ускользание от внимания: исчезать из виду и памяти, носить чужие лица, скрывать других.'
oblivion:
    name: 'Забвение'
    summary: 'Сила тени и смерти: власть над тьмой, общение с призраками, церемонии, черпающие из Бездны.'
potence:
    name: 'Мощь'
    summary: 'Сверхъестественная сила: сокрушительные удары, невероятные прыжки, питание грубой силой.'
presence:
    name: 'Внушительность'
    summary: 'Власть над чувствами: трепет, страх, обожание и величие, перед которым склоняется толпа.'
protean:
    name: 'Превращение'
    summary: 'Изменение облика: зрение во тьме, когти, погружение в землю, звериные формы и туман.'
thin-blood-alchemy:
    name: 'Слабокровная алхимия'
    summary: 'Ремесло слабокровных: варить из витэ и странных ингредиентов формулы, подражающие другим Дисциплинам.'
