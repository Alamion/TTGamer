strength:
    name: Сила
    shortDescription: Грубая физическая мощь
    specialties:
        - Крепкая хватка
        - Массивный
        - Коренастый
        - Здоровяк
        - Широкие плечи
        - Крепыш
        - Мощный
        - Бугрящиеся бицепсы
        - Жилистый
        - Крупный
    scale:
        - 'Слабо: вы выжимаете лёжа 18 кг.'
        - 'Средне: вы выжимаете лёжа 45 кг.'
        - 'Хорошо: вы выжимаете лёжа 115 кг.'
        - 'Отлично: вы выжимаете лёжа 180 кг.'
        - 'Превосходно: вы выжимаете лёжа 295 кг.'
dexterity:
    name: Ловкость
    shortDescription: Скорость, проворство и координация
    specialties:
        - Плавные движения
        - Гибкий
        - Твёрдая рука
        - Умелый
        - Грациозный
        - Проворный
        - Атлетичный
        - Кошачьи рефлексы
        - Быстрый
        - Уверенный шаг
        - Быстроногий
        - Лёгкое касание
    scale:
        - 'Слабо: у вас всё валится из рук — лучше не берите бензопилу.'
        - 'Средне: вы можете идти и жевать жвачку одновременно.'
        - 'Хорошо: у вас отличные природные атлетические задатки.'
        - 'Отлично: вы жонглируете пятью ножами.'
        - 'Превосходно: вы жонглируете пятью ножами с завязанными глазами.'
stamina:
    name: Выносливость
    shortDescription: Здоровье, стойкость и живучесть
    specialties:
        - Неутомимый
        - Стойкий
        - Крепкий
        - Решительный
        - Напористый
        - Упорный
        - Непоколебимый
        - Живучий
        - Энергичный
        - Преданный делу
    scale:
        - 'Слабо: вы хрупкого сложения и часто болеете.'
        - 'Средне: у вас обычное здоровье.'
        - 'Хорошо: вы в хорошей форме благодаря регулярным тренировкам.'
        - 'Отлично: вы можете пробежать марафон.'
        - 'Превосходно: вы настолько крепки, что переживёте почти что угодно.'
charisma:
    name: Харизма
    shortDescription: Обаяние, притягательность и привлекательность
    specialties:
        - Обходительный
        - Красноречивый
        - Общительный
        - Пленительный
        - Очаровательный
        - Величественный
        - Добродушный
        - Воспитанный
        - Светский
        - Утончённый
        - Простодушный
        - Любезный
    scale:
        - 'Слабо: окружающие избегают вашего общества.'
        - 'Средне: вы симпатичны людям.'
        - 'Хорошо: люди доверяют вам и делятся секретами.'
        - 'Отлично: в вас есть что-то, что притягивает людей.'
        - 'Превосходно: вы могли бы вести за собой целый народ.'
manipulation:
    name: Манипулирование
    shortDescription: Хитрость, убеждение и коварство
    specialties:
        - Бойкий
        - Выразительный
        - Коварный
        - Убедительный
        - Обходительный
        - Сладкоречивый
        - Бравада
        - Льстивый
        - Красноречивый
        - Заговаривающий зубы
        - Двуличный
        - Софист
        - Остроумный
    scale:
        - 'Слабо: вы изъясняетесь как можно короче.'
        - 'Средне: вам могут и поверить.'
        - 'Хорошо: из вас вышел бы неплохой адвокат.'
        - 'Отлично: вам пора баллотироваться на выборах.'
        - 'Превосходно: вы продадите лёд жителю ледяной планеты.'
appearance:
    name: Внешность
    shortDescription: Облик, красота и манера держаться
    specialties:
        - Смелый вид
        - Соблазнительный
        - Пленительный
        - Сексуальный
        - Сияющий
        - Честное лицо
        - Внушительный
        - Благородный
        - Приятный
        - Красивый
        - Прекрасный
        - Великолепный
        - Орлиный взгляд
    scale:
        - 'Слабо: вы часто вызываете у окружающих неприязнь.'
        - 'Средне: вас легко не заметить — вы сливаетесь с толпой.'
        - 'Хорошо: у вас приятная внешность, и к вам хорошо относятся.'
        - 'Отлично: вы достаточно хороши собой, чтобы быть моделью.'
        - 'Превосходно: первая реакция на вас — трепет, жгучая зависть или полная услужливость.'
perception:
    name: Восприятие
    shortDescription: Наблюдательность, проницательность и интуиция
    specialties:
        - Проницательный
        - Внимательный
        - Терпеливый
        - Пытливый
        - Зоркий
        - Интуитивный
        - Прозорливый
        - Сметливый
        - Настороженный
    scale:
        - 'Слабо: вы не замечаете ничего, кроме очевидного.'
        - 'Средне: тонкие взаимодействия вокруг проходят мимо вас.'
        - 'Хорошо: вы улавливаете настроения и оттенки.'
        - 'Отлично: вы постоянно чутки к нюансам жизни.'
        - 'Превосходно: вы найдёте иголку в стоге сена.'
intelligence:
    name: Интеллект
    shortDescription: Рассудок, знания и память
    specialties:
        - Здравомыслящий
        - Творческий
        - Эрудированный
        - Прагматичный
        - Сметливый
        - Блестящий
        - Книжный червь
        - Ясный ум
    scale:
        - 'Слабо: IQ 80'
        - 'Средне: IQ 100'
        - 'Хорошо: IQ 120'
        - 'Отлично: IQ 140'
        - 'Превосходно: IQ 160+'
wits:
    name: Сообразительность
    shortDescription: Быстрота мысли и находчивость
    specialties:
        - Смышлёный
        - Прозорливый
        - Острый ум
        - Практичный
        - Хитроумный
        - Хладнокровный
        - Изобретательный
    scale:
        - 'Слабо: вы отправляете деньги телепроповедникам.'
        - 'Средне: вы знаете, когда в покере повышать, а когда сбрасывать.'
        - 'Хорошо: вы справляетесь с часом пик в мегаполисе.'
        - 'Отлично: вы могли бы выступать со стендапом.'
        - 'Превосходно: у вас вместо мозга суперкомпьютер — и он быстрый.'
_labels:
    category:
        Physical: Физические
        Social: Социальные
        Mental: Ментальные
