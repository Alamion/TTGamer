fragmentation-grenade:
    name: Осколочная граната
    notes: Стандартный осколочный взрыв. Смертельный радиус около 5 ярдов.
concussion-grenade:
    name: Конкуссионная граната
    notes: Несмертельный взрыв. Ударная волна оглушает и дезориентирует.
thermal-detonator:
    name: Термальный детонатор
    notes: Зажигательный взрыв. Поджигает материалы, как белый фосфор.
smoke-grenade:
    name: Дымовая граната
    notes: Заполняет густым дымом область 10×10 ярдов на 10 минут.
ion-grenade:
    name: Ионная граната
    notes: Электромагнитный импульс. Выводит из строя дроидов и электронику, не действует на органику.
proton-grenade:
    name: Протонная граната
    notes: Бронебойная фугасная граната. Небольшой смертельный радиус.
anti-vehicle-mine:
    name: Противотранспортная мина
    notes: Срабатывает от давления. Предназначена для техники, но смертельна и для пехоты.
proton-missile:
    name: Протонная ракета
    notes: Оружие техники и огневых точек. Запускается из ракетной установки. Урон масштаба Спидер.
concussion-missile:
    name: Конкуссионная ракета
    notes: Противопехотная ракета по площади. Широкий радиус взрыва.
explosive-charge:
    name: Подрывной заряд
    notes: Устанавливаемый заряд. Подрыв по таймеру или дистанционно. Заряды можно связывать.
_labels:
    type:
        Grenade: Граната
        Mine: Мина
        Missile: Ракета
        Explosive Charge: Подрывной заряд
    damageType:
        L: Л
        B: Д
        Special: Особый
