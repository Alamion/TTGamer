banu-haqim:
    name: 'Бану Хаким'
    summary: 'Судьи и убийцы, карающие виновных и чтущие закон и родословную, — вечно между справедливостью и жаждой крови Сородичей.'
    bane: 'Утолив хотя бы один пункт Голода кровью вампира, они проходят проверку голодного безумия со сложностью 2 + Тяжесть проклятия; при провале пьют дальше, вплоть до диаблери.'
    variantBane: 'Ядовитая кровь: их витэ ядовита для смертных — тяжёлый урон, равный Тяжести проклятия, за каждую проверку жажды выпитой крови; она не лечит раны смертных.'
    compulsion: 'Суд: до конца сцены вампир должен утолить хотя бы пункт Голода кровью того, кто пошёл против его Убеждения; пока не сделает этого, все броски с штрафом -3.'
brujah:
    name: 'Бруха'
    summary: 'Страстные бунтари, драчуны и идеалисты, восстающие против любого порядка — и среди Сородичей, и среди смертных.'
    bane: 'Их ярость едва сдерживается: броски на сопротивление безумию ярости теряют дайсы, равные Тяжести проклятия, но не меньше одного дайса.'
    variantBane: 'Насилие: при грязном критическом успехе в любой проверке Навыка они ранят того, с кем имеют дело, телесно или душевно, на Тяжесть проклятия тяжёлого урона; пункт Воли делает урон лёгким.'
    compulsion: 'Мятеж: вампир должен пойти против статус-кво; штраф -2 ко всем броскам, пока он не переубедит кого-то или не сделает обратное тому, чего от него ждали.'
gangrel:
    name: 'Гангрел'
    summary: 'Дикие странники, ближе всех стоящие к Зверю; дома в глуши и в подворотнях, ценят выживание и свободу выше придворных интриг.'
    bane: 'Каждое безумие оставляет звериные черты — столько, какова Тяжесть проклятия, — ещё на одну ночь; каждая снижает один Атрибут на 1 (по умолчанию Интеллект или Манипуляцию).'
    variantBane: 'Инстинкт выживания: броски на сопротивление безумию страха теряют дайсы, равные Тяжести проклятия, но не меньше одного дайса.'
    compulsion: 'Неистовство: на сцену вампир дичает — штраф -3 к броскам Манипуляции и Интеллекта, и говорить он может только односложно.'
hecata:
    name: 'Геката'
    summary: 'Союз некромантических семей, торгующих смертью, призраками и тайнами загробного мира.'
    bane: 'Их Поцелуй мучителен: им доступно лишь опасное для жертвы питьё, несвязанные смертные вырываются, согласные бросают Выносливость + Решимость против 2 + Тяжесть проклятия, а Сородичам грозит безумие страха.'
    variantBane: 'Тлен: у них есть дополнительные точки Недостатков, равные Тяжести проклятия, среди Слуг, Убежища и Ресурсов, а покупка этих Дополнений стоит на Тяжесть проклятия опыта дороже.'
    compulsion: 'Мертвенность: вампир должен перевести что-то из жизни в смерть или обратно — человека, вещь, идею или разговор; штраф -2 ко всему прочему, пока не добьётся своего.'
lasombra:
    name: 'Ласомбра'
    summary: 'Гордые и безжалостные повелители теней, ставящие успех и власть выше любых сомнений.'
    bane: 'Зеркала и записи искажают их облик, выдавая знающим; любая современная связь, даже звонок, требует проверки Технологии со сложностью 2 + Тяжесть проклятия.'
    variantBane: 'Бессердечие: броски Раскаяния теряют дайсы, равные Тяжести проклятия, но не меньше одного дайса.'
    compulsion: 'Беспощадность: после следующего провала штраф -2 ко всем броскам, пока новая попытка того же действия не удастся или не закончится сцена.'
malkavian:
    name: 'Малкавиан'
    summary: 'Провидцы и безумцы, чей расколотый разум видит то, что упускают другие; оракулы и тёмные лошадки любой секты.'
    bane: 'У каждого есть душевный недуг; после звериного провала или Побуждения одна выбранная категория бросков (Физические, Социальные или Ментальные) теряет дайсы по Тяжести проклятия до конца сцены.'
    variantBane: 'Противоестественность: когда они применяют Дисциплину, смертные рядом пугаются — социальные броски с ними, кроме запугивания, теряют дайсы по Тяжести проклятия на сцену; вампиры сразу узнают в них нежить.'
    compulsion: 'Наваждение: на сцену восприятие искажено — штраф -2 к броскам Ловкости, Манипуляции, Самообладания и Смекалки, а также к сопротивлению безумию страха.'
ministry:
    name: 'Министерство'
    summary: 'Змеи веры и искушения, сеющие культы и освобождающие других от добровольных оков — чаще всего чтобы надеть новые.'
    bane: 'Они сторонятся света: под направленным на них ярким светом все броски теряют дайсы по Тяжести проклятия, а солнце наносит на столько же больше тяжёлого урона.'
    variantBane: 'Холодная кровь: Цвет жизни доступен лишь вскоре после питания от живого (в той же сцене или около часа) и требует проверок жажды по Тяжести проклятия вместо одной.'
    compulsion: 'Преступание: штраф -2 ко всему, кроме попыток склонить кого-то (или себя) нарушить Закон хроники или Убеждение и получить Пятно.'
nosferatu:
    name: 'Носферату'
    summary: 'Чудовищно изуродованные шпионы и торговцы сведениями, прячущиеся в канализации и сетях и живущие тайнами.'
    bane: 'Их облик ужасен: у них Недостаток Безобразность, они не могут развивать Внешность, а любая попытка сойти за человека, даже маскировкой Затемнения, теряет дайсы по Тяжести проклятия.'
    variantBane: 'Паразиты: за ними всюду следуют паразиты; в их убежище броски на сосредоточение получают штраф 2 + Тяжесть проклятия, в любом месте, где они провели сцену, — по Тяжести проклятия, как и Анимализм на этих тварей.'
    compulsion: 'Криптофилия: жажда тайн; штраф -2 ко всему, что не ведёт к раскрытию секрета, пока вампир не узнает что-то действительно полезное (делиться не обязательно).'
ravnos:
    name: 'Равнос'
    summary: 'Беспокойные обманщики и странники, рассеянные пламенем, поглотившим их родоначальника; живут иллюзиями и дерзостью.'
    bane: 'Проспав в одном месте дважды за семь ночей, они бросают дайсы по Тяжести проклятия и получают 1 тяжёлый урон за каждую 10; места отдыха должны отстоять на милю. Недостаток «Без убежища» недоступен.'
    variantBane: 'Имя до Становления: назвавший их прежнее имя в лицо получает бонус по Тяжести проклятия к сопротивлению их Дисциплинам, а Равнос — такой же штраф к сопротивлению его силам.'
    compulsion: 'Искушение судьбы: следующую проблему нужно решать дерзко; любое решение, кроме самого рискованного, получает штраф -2, пока проблема не решена или не стала нерешаемой.'
salubri:
    name: 'Салюбри'
    summary: 'Редкие гонимые целители и искатели с третьим глазом, чью кровь жаждут, а самих презирают другие Сородичи.'
    bane: 'Сородич, утоляющий Голод их кровью, проходит проверку голодного безумия со сложностью 2 + Тяжесть проклятия (3 + для Бану Хаким); их третий глаз не скрыть силами, и он кровоточит при применении Дисциплин.'
    variantBane: 'Аскеза: пока их Голод ниже 3, броски Дисциплин теряют дайсы по Тяжести проклятия; третий глаз остаётся.'
    compulsion: 'Эмоциональная эмпатия: вампир стремится облегчить чью-то личную беду в сцене; штраф -2 к прочим действиям, пока беде не помогут, не случится кризис серьёзнее или не кончится сцена.'
toreador:
    name: 'Тореадор'
    summary: 'Художники, эстеты и светские львы, сердце Элизиума, чья любовь к красоте граничит с голодом.'
    bane: 'В обстановке, кажущейся им уродливой, броски Дисциплин теряют дайсы по Тяжести проклятия; звериный провал нередко ввергает их в восхищённый транс.'
    variantBane: 'Мучительная эмпатия: если их питание ранит смертного, они получают такой же урон, обычно тяжёлый, не больше Тяжести проклятия за раз, — синяками на месте укуса.'
    compulsion: 'Одержимость: заворожённый чем-то прекрасным, вампир говорит только об этом; штраф -2 к прочим действиям, пока предмет не исчезнет из виду или не кончится сцена.'
tremere:
    name: 'Тремер'
    summary: 'Маги крови из рухнувшей пирамиды, некогда чародеи Камарильи, а ныне соперничающие дома, жаждущие оккультной силы.'
    bane: 'Их витэ больше не создаёт Узы крови с Сородичами, а чтобы связать смертного или гуля, нужно дополнительно столько глотков, какова Тяжесть проклятия.'
    variantBane: 'Украденная кровь: Прилив крови требует проверок жажды по Тяжести проклятия; если Голод дойдёт до 5, можно отказаться от прилива или завершить его и остаться с Голодом 5.'
    compulsion: 'Перфекционизм: штраф -2 ко всем броскам до критического успеха в проверке Навыка или конца сцены; при повторе действия штраф снижается до -1, затем исчезает.'
tzimisce:
    name: 'Цимисхи'
    summary: 'Собственники и властители старого света, мастера плоти, привязанные ко всему, что объявили своим.'
    bane: 'Каждый выбирает чётко очерченное владение (земля, люди, группа) и должен проводить дневной сон в его окружении, иначе получает тяжёлый урон Воли по Тяжести проклятия.'
    variantBane: 'Проклятая учтивость: войти без приглашения в обитаемый дом стоит Воли по Тяжести проклятия, и столько же дайсов теряют броски Дисциплин внутри; Фольклорный запрет на это не берётся.'
    compulsion: 'Алчность: вампир жаждет завладеть чем-то в сцене; штраф -2 ко всему прочему, пока желаемое не окажется в его власти или не станет недостижимым.'
ventrue:
    name: 'Вентру'
    summary: 'Аристократы и вожди, правящие Камарильей, бизнесом и политикой через долг, богатство и власть.'
    bane: 'Изысканный вкус: они удерживают кровь лишь одного типа смертных; питание иной кровью стоит Воли по Тяжести проклятия. Решимость + Бдительность (4+) распознаёт подходящую.'
    variantBane: 'Иерархия: броски Дисциплин против вампира более низкого поколения теряют дайсы по Тяжести проклятия, а прямое нападение на него стоит Воли по Тяжести проклятия.'
    compulsion: 'Спесь: кто-то должен выполнить приказ вампира без сверхъестественного принуждения; до тех пор штраф -2 ко всему, что не связано с командованием.'
caitiff:
    name: 'Каитифф'
    summary: 'Вампиры без клана, в чьей Крови не видно родословной; кланы их презирают, зато им доступна любая Дисциплина.'
    bane: 'Кланового проклятия нет, но они начинают с Недостатком Подозрительная личность и без Статуса, могут терять 1-2 дайса в Социальных бросках с Сородичами, а Дисциплины стоят 6 × новый уровень опыта.'
thin-blood:
    name: 'Слабокровный'
    summary: 'Вампиры 14-го поколения и далее со слабой кровью, наполовину смертные: сходят за людей и варят алхимию.'
    bane: 'Кланового проклятия (Тяжесть 0) и Побуждения нет; вместо них — Достоинства и Недостатки слабой крови, Сила крови 0, а Узы и Становление ненадёжны.'
