knife:
    name: Нож
    notes: Простой клинок.
vibroblade:
    name: Виброклинок
    notes: Силовой клинок (+1D к урону обычного ножа).
club-baton:
    name: Дубинка
    notes: Простое ударное оружие. Лёгкое в обращении.
sword:
    name: Меч
    notes: Тяжёлое клинковое оружие. Рубит лучше ножа.
force-pike:
    name: Силовая пика
    notes: Древковое оружие с электрическим наконечником. Складывается для хранения.
electrostaff:
    name: Электропосох
    notes: Посох с магнитной защитой. Может парировать световой меч.
staff:
    name: Посох
    notes: Двуручное оружие с увеличенной досягаемостью.
training-lightsaber:
    name: Тренировочный световой меч
    notes: Учебный клинок, не наносящий смертельных ран. Оглушает при касании.
lightsaber:
    name: Световой меч
    notes: Игнорирует броню. Сложность 8 (снижается тренировкой).
