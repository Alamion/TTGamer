allies:
    name: Союзники
    shortDescription: Люди, которые помогут вам без немедленной оплаты
    scale:
        - Один союзник скромных возможностей — местный знакомый с ограниченным влиянием.
        - Двое-трое союзников или один союзник с заметным влиянием в своей области.
        - Несколько союзников по всему региону или один очень влиятельный союзник уровня сектора.
        - Сеть союзников в нескольких системах, включая одного могущественного покровителя.
        - Союзники на самом верху — мофф, который вам обязан, лидер ячейки повстанцев, безоговорочно вам доверяющий, или хатт, считающий вас другом.
contacts:
    name: Контакты
    shortDescription: Информаторы, снабжающие вас сведениями
    scale:
        - Один контакт в определённом социальном кругу или профессии.
        - Несколько контактов в смежных областях — неплохой охват одной сферы.
        - Контакты по всему городу или космопорту, в самых разных слоях общества.
        - Широкая сеть по планете или сектору — кто-нибудь всегда что-то знает.
        - Контакты от высших кругов общества до самого дна преступного мира.
customization:
    name: Кастомизация
    shortDescription: Предмет снаряжения, улучшенный сверх заводских характеристик
    scale:
        - Косметические или удобные улучшения. Покраска или обвес для стильного или грозного вида. Комлинк, встроенный в кибернетическую руку.
        - Простые улучшения. Повышение характеристики на 1D или 20%. Скрытый вибронож в кибернетической руке.
        - Средние улучшения. Повышение характеристики на 2D или 40%. Скрытый бластер в кибернетической руке.
        - Сложные улучшения. Повышение характеристики на 3D или 60%. Тяжёлый бластерный пистолет в кибернетической руке.
        - Выдающиеся улучшения. Повышение характеристики на 4D или 80%. Лёгкий повторитель в кибернетической руке.
droid:
    name: Дроид
    shortDescription: У вас есть дроид — неигровой персонаж
    scale:
        - Дроид пятой степени — простой труд, уборка или подсобные работы (например, дроид-мышь MSE-6).
        - Дроид четвёртой степени — охранный или боевой дроид (например, боевой дроид B1, часовой IG-86).
        - Дроид третьей степени — протокольный или сервисный дроид (например, C-3PO, TC-4).
        - Дроид второй степени — астромеханик или технический дроид (например, R2-D2, BB-8).
        - Дроид первой степени — медицинский или научный дроид (например, хирургический дроид 2-1B).
influence:
    name: Влияние
    shortDescription: Связи с организациями — правительство, гильдия или криминал
    scale:
        - Небольшое влияние — вы знаете нескольких функционеров среднего звена в организации.
        - Умеренное влияние — вы добиваетесь встреч, обходите очереди и попадаете в полузакрытые места.
        - Значительное влияние — ваше имя имеет вес. Вы можете попросить о серьёзных услугах.
        - Большое влияние — у вас прямой выход на высокопоставленных чиновников, вы определяете местную политику.
        - Огромное влияние — вы приводите в движение целые организации. Ваши связи достигают высших палат.
mentor:
    name: Наставник
    shortDescription: Опытный учитель, который даёт вам советы
    scale:
        - Наставник, доступный на расстоянии — голозвонки и редкие встречи.
        - Наставник, который регулярно выходит на связь и несколько раз за историю советует лично.
        - Наставник, который обычно рядом и активно вкладывается в ваше развитие.
        - Наставник с серьёзной репутацией или властью, посвящающий много времени вашему обучению.
        - Легендарная фигура — магистр-джедай, военачальник уровня сектора, криминальный лорд с огромным влиянием — лично ведёт вас.
military-rank:
    name: Воинское звание
    shortDescription: Официальное звание в военной организации
    scale:
        - Сержант (Армия) / главстаршина (Флот) — унтер-офицер, командует небольшим отделением или секцией.
        - Лейтенант (Армия) / энсин (Флот) — младший офицер, командует взводом или возглавляет отдел.
        - Майор (Армия) / коммандер (Флот) — старший офицер среднего звена, командует батальоном или небольшим кораблём.
        - Полковник (Армия) / капитан (Флот) — старший офицер, командует полком или крупным кораблём.
        - Генерал (Армия) / адмирал (Флот) — высший офицер, командует силами сектора или флотом.
noble-status:
    name: Дворянский титул
    shortDescription: Титул и положение в обществе благодаря знатному происхождению
    scale:
        - Барон, вождь клана или землевладелец — скромный титул с местной известностью.
        - Граф или глава нескольких домов или кланов — известен по всему родному региону.
        - Герцог, напрямую управляющий значительной частью населения и земель вашей планеты.
        - Принц, принцесса или возможный наследник высшего положения на вашей планете.
        - Король, королева или монарх — правящий суверен вашей планеты.
reputation:
    name: Репутация
    shortDescription: Вы чем-то известны по всей галактике
    scale:
        - Известны в узкой среде — среди контрабандистов, пилотов или в определённой гильдии.
        - Известны в своей местности или в пределах одного отделения гильдии или организации.
        - Известны на всей планете или во всей гильдии.
        - Известны во всей звёздной системе.
        - Известны по всей галактике — ваше имя и лицо узнают повсюду.
resources:
    name: Ресурсы
    shortDescription: Свободные средства и материальное богатство
    scale:
        - Бедность — 500 кредитов в месяц. Вы живёте скромно и не можете позволить себе крупных покупок.
        - Достаток — 2000 кредитов в месяц. Скромная жизнь с небольшими сбережениями на чёрный день.
        - Комфорт — 10 000 кредитов в месяц. Хороший звездолёт, приличное снаряжение и никаких повседневных забот о деньгах.
        - Состоятельность — 50 000 кредитов в месяц. Вы финансируете операции, покупаете дорогое снаряжение и живёте хорошо.
        - Богатство — 250 000+ кредитов в месяц. У вас серьёзные активы — поместья, корабли и достаточно денег, чтобы влиять на политику сектора.
retainers:
    name: Прислужники
    shortDescription: Верные последователи, выполняющие ваши приказы
    scale:
        - Один прислужник — например, преданный матрос или личный помощник.
        - Пара прислужников или один с необычайно полезными навыками.
        - Небольшая команда из трёх-пяти прислужников — достаточно, чтобы обслуживать корабль или вести небольшое дело.
        - Отделение прислужников (от шести до десяти) — вы можете содержать скромную базу или оживлённую контору в космопорте.
        - Взвод прислужников (от двенадцати до двадцати) — в вашем распоряжении настоящая людская сила.
vehicle:
    name: Транспорт
    shortDescription: Личное транспортное средство в вашем распоряжении
    scale:
        - Безоружная машина масштаба «Спидер» — свуп, лендспидер или аэроспидер.
        - Вооружённая машина масштаба «Спидер» или «Шагающий» — спидер с установленным оружием или AT-ST.
        - Машина масштаба «Звездолёт» — звёздный истребитель, шаттл или лёгкий грузовик (например, YT-1300, A-wing).
        - Машина масштаба «Транспорт» — тяжёлый грузовик, корвет или судно размером с фрегат.
        - Машина масштаба «Капитальный» — крейсер, разрушитель или звездолёт ещё крупнее.
_labels:
    category:
        Social Influence: Социальное влияние
        Equipment: Снаряжение
        Status: Статус
        Wealth: Богатство
