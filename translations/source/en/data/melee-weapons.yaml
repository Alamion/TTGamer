knife:
    name: Knife
    description: A simple blade — combat knife, vibro-shiv, or equivalent. Ubiquitous across the galaxy. When all else fails, you still have a knife.
    notes: Basic blade.
vibroblade:
    name: Vibroblade
    description: A powered blade that vibrates at ultra-high frequency, allowing it to slice through armor and bone. Standard melee weapon for military operatives and bounty hunters who expect to face armored opponents. The vibro-edge adds +1D to the damage of a standard knife.
    notes: Powered blade (+1D over standard knife).
club-baton:
    name: Club / Baton
    description: A simple club, baton, or weighted bar. Easy to pick up and swing — the lowest difficulty of any melee weapon. Standard issue for police and security forces who prefer non-lethal options.
    notes: Basic blunt weapon. Easy to use.
sword:
    name: Sword
    description: A heavy bladed weapon — vibrosword, cavalry sabre, or ceremonial blade. Carried by officers for tradition and by warriors for practicality. A well-made sword can cleave through unarmored opponents and holds an edge even after heavy use.
    notes: Heavy bladed weapon. Better chopping power than a knife.
force-pike:
    name: Force Pike
    description: A collapsible polearm with an electrified tip carried by Imperial Royal Guards and Praetorian Guards. The force pike can deliver a powerful shock on contact, stunning or killing unarmored targets. Its reach makes it effective against lightsaber-wielders, and the shaft is reinforced to withstand a lightsaber blow.
    notes: Electrified polearm. Can be shortened for storage.
electrostaff:
    name: Electrostaff
    description: A magnetically sealed staff with energized ends, used by MagnaGuards and elite separatist troops. The electrostaff is specifically designed to resist lightsaber cuts — the magnetic seals disperse the blade's energy. Each end delivers a stunning electrical discharge on contact.
    notes: Magnetically sealed staff. Can parry lightsabers.
staff:
    name: Staff
    description: A long striking pole, quarterstaff, or electrostaff. Grants reach advantage and can be used to trip, block, or strike from range. Requires two hands but delivers solid impact.
    notes: Two-handed reach weapon.
training-lightsaber:
    name: Training Lightsaber
    description: A low-power lightsaber used by Jedi younglings and padawans for training. The blade delivers a painful but non-lethal stun, allowing students to spar without risk of dismemberment. Uses the same difficulty as a standard lightsaber but deals minimal damage.
    notes: Non-lethal practice blade. Stuns on contact.
lightsaber:
    name: Lightsaber
    description: The elegant weapon of a Jedi Knight. A blade of pure plasma that cuts through almost any material. Lightsabers ignore all armor soak dice — only specially reinforced exotic materials can resist them. The base difficulty of 8 reflects the intense focus required; training in Force skills can reduce this.
    notes: Ignores armor. Difficulty 8 (reduced by training).
