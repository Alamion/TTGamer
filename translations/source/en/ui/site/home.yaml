    status: Active Development — v{version}
    openSheet: Open the sheet
    siteGuide: Site guide
games:
    heading: Games
    starWars:
        title: Star Wars WoD 2e
        summary: The Star Wars galaxy on the World of Darkness 2nd Edition d10 pool engine. Sheets for characters, droids, creatures, vehicles, and fodder groups; rules, searchable catalogs, and a worked example of play.
        quickStart: Quick start
        rules: Rules
    v5:
        title: World of Darkness V5
        summary: 'Hunter: the Reckoning and Vampire: the Masquerade on one engine, with Storyteller characters and groups for the people the players meet. Rolls read Desperation, Hunger, and criticals for you.'
        hunterQuickStart: 'Hunter: quick start'
        vampireQuickStart: 'Vampire: quick start'
        rules: Rules
features:
    heading: What the Site Does
    documents:
        title: Documents, Not Just Characters
        summary: Characters, creatures, vehicles, and groups in folders, with search, filters, and undo. Every shipped type has a full sheet and a brief that fits a phone screen.
    layout:
        title: Several Documents at Once
        summary: Arrange documents and tools like tabs in a code editor — split in any direction, drag tabs between groups, float the library or the dice roller above the page.
    templates:
        title: Pages You Can Change
        summary: Every sheet is a template. Edit a page in place, or build your own settings, document types, and catalogs in the library and share them as files.
    dice:
        title: Dice Roller
        summary: Dice notation with explosions, rerolls, success counting, and special dice; 3D dice with physics and sound, or plain 2D results. A trait on a sheet rolls its own pool.
    rollSharing:
        title: Rolls in Your Chat
        summary: Post rolls to a Discord channel or a Matrix room, named after the character who made them.
    storage:
        title: Your Data Stays with You
        summary: No account. Documents are saved in the browser as you type; export a document or a template to a file and import it on another device.
