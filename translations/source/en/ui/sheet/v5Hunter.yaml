summaries:
    creeds:
        entrepreneurial: Builds, invents, or buys whatever the hunt needs.
        faithful: Faces the unnatural with conviction, faith, or ritual.
        inquisitive: Digs for the truth of what the monsters are and how they work.
        martial: Solves the problem with planning, training, and force.
        underground: Works through hidden networks, favors, and secrets.
    drives:
        curiosity: Needs to know what is really out there.
        vengeance: Wants a monster to pay for what it took.
        oath: Bound by a promise to protect someone or end something.
        greed: Sees profit or power waiting in the hunt.
        pride: Needs to prove they are the one who can do this.
        envy: Wants what the monsters have.
        atonement: Hunts to make up for a failure in their past.
    edges:
        arsenal: Weapons beyond what an ordinary person can get.
        fleet: Vehicles ready whenever the cell needs to move.
        ordnance: Explosives and clever ways to deliver them.
        library: A growing collection of lore about the creatures.
        improvised-gear: Useful tools built from whatever is at hand.
        global-access: A way into records, systems, and networks.
        drone-jockey: Remote drones for scouting and support.
        beast-whisperer: Animals that work alongside the hunter.
        sense-the-unnatural: A feeling for when something inhuman is near.
        repel-the-unnatural: The power to drive creatures back.
        thwart-the-unnatural: Resistance against powers aimed at the hunter.
        artifact: An object with a strange power against monsters.
