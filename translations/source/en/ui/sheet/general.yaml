system: General
library:
    intro: Documents for any game — notes and other kinds that need no rules. Shipped with the app.
    ownTypes: Any game
    ownTypesNote: Kinds for any game, outside every setting. Their pages are the fallback for your settings here.
    coreTypes: 'Kinds for any game: {names}. Every setting of yours here has them.'
    coreTypeNote: A kind for any game inside your setting. Give it pages of its own here; it cannot be moved or deleted.
note:
    type: Note
    view: Note
    name: Name
    body: Text
    example:
        label: How notes work
        name: How notes work
        text: |
            # How notes work
            Every line is its own paragraph, so you can write as you think.
            Press **Edit** (or Ctrl+E) to change this note, and **Done** (or Esc) to read it.
            ## Formatting
            **Bold**, *italic*, ~~struck out~~, ==highlighted==, `code`, and [links](https://example.org).
            ## Lists and checklists
            - [x] Tick a box right here while reading
            - [ ] Prepare the docks scene
              - Ines waits by the crates
            1. Numbered lists work too
            ## Tables
            | NPC | Wants |
            |:---|:---|
            | Ines Ruiz | money |
            | Bruno Kessel | to be left alone |
            ## Callouts
            > [!tip] An open callout
            > For anything you want to stand out.
            > [!spoiler]- A folded callout
            > Starts folded: open it when the players get there.
            ## Rolls
            Ambush: `dice: 6d10>=6`
