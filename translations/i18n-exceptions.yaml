# Reviewed exceptions for the translation coverage verifier (`yarn i18n:verify`).
#
# Each entry silences findings of one rule and MUST explain why:
#
#   - rule: interface          # interface | keys | unused | identical | plural | catalog | pickers
#                              # | docs | docs-terms | glossary | overflow
#     file: src/some/path/*.tsx # optional glob, relative to the repository root
#     match: 'd100'            # exact finding text, or /regex/ for a pattern
#     reason: dice notation shown verbatim
#
# Treat a new entry like a new lint disable: prefer translating the text.
- rule: interface
  file: src/dice_roller/components/dice_pool/DicePool.tsx
  match: WoD
  reason: World of Darkness system abbreviation, the dice tab name in every locale
- rule: interface
  file: src/pages/index.tsx
  match: Star Wars WEG
  reason: product name (the West End Games Star Wars RPG)
- rule: interface
  file: src/pages/index.tsx
  match: React 19 + Docusaurus 3.10
  reason: technology names and versions
- rule: identical
