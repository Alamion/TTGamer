# Book-term glossary (spec 009). One entry per game term:
#
#   - id: larceny                                  # unique in this file, kebab-case
#     en: Larceny                                  # English book name (must match the English text at every ref)
#     ru: Воровство                                # approved Russian form (must match the Russian text at every ref)
#     ruShort: Воровство                           # optional; shown when a sheet row is narrow
#     note: why this translation was chosen        # optional
#     refs:                                        # UI message ids or catalog:<catalogId>/<entryId>
#       - ttgamer.ui.sheet.v5.skills.larceny
#
# A label is a book term exactly when its ref is listed here: it then gets the English-name hint.
- id: creed
  en: Creed
  ru: Кредо
  note: 'T-061 review: «Кредо»'
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.creed
- id: drive
  en: Drive
  ru: Мотив
  note: 'T-061 review: «Мотив»'
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.drive
- id: ambition
  en: Ambition
  ru: Цель
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.ambition
- id: desire
  en: Desire
  ru: Желание
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.desire
- id: redemption
  en: Redemption
  ru: Искупление
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.redemption
- id: despair
  en: Despair
  ru: Отчаяние
  note: 'T-061 review: «Отчаяние»'
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.despair
- id: desperation
  en: Desperation
  ru: Безысходность
  note: 'T-061 review: «Безысходность» (the pool that can turn into Despair)'
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.desperation
      - ttgamer.ui.sheet.v5Hunter.dice.line
- id: danger
  en: Danger
  ru: Опасность
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.danger
- id: edge
  en: Edge
  ru: Грань
  note: 'T-061 review: «Грань»; «Преимущество» is deliberately not used, it reads as Advantages'
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.edge
- id: perk
  en: Perk
  ru: Умение
  note: 'T-061 review: «Умение»'
  refs:
      - ttgamer.ui.sheet.v5Hunter.fields.perk
- id: assets
  en: Assets
  ru: Ресурсы
  refs:
      - ttgamer.ui.sheet.v5Hunter.categories.assets
- id: aptitudes
  en: Aptitudes
  ru: Способности
  note: 'T-061 review: «Способности»; Star Wars Abilities share the name deliberately — the two play the same role and never appear on one sheet'
  refs:
      - ttgamer.ui.sheet.v5Hunter.categories.aptitudes
- id: endowments
  en: Endowments
  ru: Дары
  note: 'T-061 review: «Дары»'
  refs:
      - ttgamer.ui.sheet.v5Hunter.categories.endowments
