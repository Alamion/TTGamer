# Thin runner config (spec 024): every job calls one `yarn ci:*` command from package.json,
# so a later Jenkins pipeline runs the same checks.
name: CI

on:
    push:
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.check }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                check: [lint, typecheck, test, deadcode, validate, build]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - uses: actions/cache@v4
              with:
                  path: |
                      node_modules/.cache
                      node_modules/.tmp
                  # A lockfile change starts cold: tsc -b and the lint cache do not notice
                  # changed dependencies (spec 026).
                  key: ci-${{ matrix.check }}-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
                  restore-keys: ci-${{ matrix.check }}-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            - run: yarn install --frozen-lockfile
            - run: yarn ci:${{ matrix.check }}

    perf:
        # Timing tests are noisy on shared runners: reported, never blocking (spec 024).
        name: perf (non-blocking)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn ci:test:perf

    e2e:
        # Browser smoke tests on the built site; they block. The timings they print never fail
        # (spec 026).
        name: e2e
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - run: yarn install --frozen-lockfile
            # Environment setup, like setup-node: the browser and its system libraries.
            - run: npx playwright install --with-deps chromium
            - run: yarn ci:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
