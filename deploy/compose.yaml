# The site and its edge proxy (T-118); the backend joins with its own `api` service.
# Usage and variables: deploy/AGENTS.md.
name: ttgamer

services:
    web:
        image: ${WEB_IMAGE:-ghcr.io/alamion/ttgamer-web:latest}
        build:
            context: ..
            args:
                SITE_URL: ${SITE_URL:-}
        restart: unless-stopped

    edge:
        image: caddy:2.10-alpine
        restart: unless-stopped
        depends_on:
            web:
                condition: service_healthy
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        environment:
            SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
            API_UPSTREAM: ${API_UPSTREAM:-api:8000}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
            - caddy_data:/data
            - caddy_config:/config

volumes:
    caddy_data:
    caddy_config:
