# Static Docusaurus build on :8080 (T-118). TLS and /api belong to the edge proxy in front.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a proxy the container's own host and port are wrong in a Location header.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles: a new build has new names.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /ru/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /ru/404.html;
    }

    # Pages, sounds, and images keep their names between builds: revalidate them.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /404.html;
    }
}
